<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7bb8"/>
      <stop offset="50%" stop-color="#ff6fa0"/>
      <stop offset="100%" stop-color="#ff9cd4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#d94c8a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="#fff7fb" rx="22" ry="22"/>
  <circle cx="180" cy="200" r="120" fill="url(#pinkGlow)" filter="url(#softShadow)" opacity="0.18"/>
  <circle cx="1040" cy="140" r="80" fill="url(#pinkGlow)" opacity="0.12"/>
  <circle cx="880" cy="300" r="110" fill="url(#pinkGlow)" opacity="0.12"/>

  <text x="200" y="240" fill="url(#pinkGlow)" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="160" font-weight="800" letter-spacing="4" filter="url(#softShadow)">
    suwappu
  </text>

  <text x="205" y="285" fill="#5c3b47" font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="600" letter-spacing="1.2">
    cross-chain swaps • secure • fast
  </text>
</svg>

