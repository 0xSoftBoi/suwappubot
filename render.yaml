services:
  # Combined Bot + API (uses Dockerfile)
  - type: web
    name: suwappu
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suwappu-db
          property: internalConnectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: TURNKEY_ORGANIZATION_ID
        sync: false
      - key: TURNKEY_API_PUBLIC_KEY
        sync: false
      - key: TURNKEY_API_PRIVATE_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LIFI_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WALLET_PROVIDER
        value: local
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_IDS
        sync: false

databases:
  - name: suwappu-db
    databaseName: suwappubot
    user: suwappu
    plan: free
