# Render Blueprint - Infrastructure as Code
# Deploy with: render.com/deploy

services:
  # Main Bot Service (Background Worker)
  - type: worker
    name: suwappubot
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt && pip install psycopg2-binary
    startCommand: python -m bot.main
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        fromDatabase:
          name: suwappubot-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_IDS
        sync: false

# PostgreSQL Database
databases:
  - name: suwappubot-db
    plan: free
    region: oregon
    postgresMajorVersion: "15"
