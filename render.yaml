services:
  # 1. API & Dashboard (Web Service)
  - type: web
    name: suwappu-web
    env: python
    buildCommand: |
      pip install -r requirements.txt
      cd dashboard && npm install && npm run build
    startCommand: ./start_web.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suwappu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2

  # 2. Telegram/WhatsApp Bot (Background Worker)
  - type: worker
    name: suwappu-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suwappu-db
          property: connectionString

databases:
  - name: suwappu-db
    databaseName: suwappubot
    user: suwappu
