services:
  # 1. API & Dashboard (Web Service)
  - type: web
    name: suwappu-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start_web.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: suwappu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2


databases:
  - name: suwappu-db
    databaseName: suwappubot
    user: suwappu
