# Suwappubot Workflow Sitewide Research Section Corrections And Metadata Improvements

## Action

Follow the sitewide-research-section-corrections-and-metadata-improvements workflow:
1. Edit research post content and metadata in showcase/public/research/replication/papers/ and showcase/src/content/research.ts
2. Update or correct SVG exhibits in showcase/public/research/
3. Update markdown renderer or DOMPurify settings in showcase/src/app/docs/[section]/[slug]/markdown.ts and showcase/src/components/docs/DocsReader.tsx
4. Update canonical URL logic and SEO metadata in showcase/src/app/layout.tsx and per-route files
