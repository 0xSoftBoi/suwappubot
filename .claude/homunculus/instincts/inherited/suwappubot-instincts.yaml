# Suwappubot Workflow Add Or Update Research Paper With Exhibits And Replication Bundle

## Action

Follow the add-or-update-research-paper-with-exhibits-and-replication-bundle workflow:
1. Add or update SVG exhibit(s) in showcase/public/research/
2. Add or update research post markdown and metadata in showcase/public/research/replication/papers/
3. Add or update code and data for replication in showcase/public/research/replication/code/ and showcase/public/research/replication/data/
4. Update research index/content in showcase/src/content/research.ts
5. Update or create route files for the paper in showcase/src/app/research/[slug]/page.tsx and/or showcase/src/app/research/replication/page.tsx
6. Update or create Open Graph images in showcase/src/app/research/[slug]/opengraph-image.tsx (if needed)
7. Update global or research-specific CSS in showcase/src/app/globals.css or showcase/src/app/research/research.module.css
8. Verify production build renders paper, exhibits, and replication bundle correctly

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: showcase/public/research/*.svg, showcase/public/research/replication/papers/*.md, showcase/public/research/replication/code/*.py

