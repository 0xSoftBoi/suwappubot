[project]
name = "electric-router"
version = "0.1.0"
description = "Optimal multi-pool Curve routing as a linear resistor network with diodes"
authors = [{ name = "Michael Egorov", email = "michwill@yieldbasis.com" }]
requires-python = ">=3.11"

# The core solver is stdlib + numpy and nothing else, so it can be lifted into a
# Pyodide/Flet frontend unchanged.  See docs/quadratic-flow-router.md and
# tests/test_purity.py, which fails the build if anything else creeps in.
dependencies = ["numpy>=2,<3"]

[dependency-groups]
dev = [
    "titanoboa==0.2.8",
    "vyper==0.4.3",
    # revm through Rust bindings: a `get_dy` is 30-449 us here against ~0.8 ms
    # marginal on the wire, so a warmed session routes with no round trips at
    # all.  Dev-only and compiled, hence nowhere near `core/`.
    "pyrevm>=0.3.7,<0.4",
    "pytest>=8",
    "pytest-xdist>=3.6,<4",
    "hypothesis>=6,<7",
    # test-only oracles: eth_abi checks core/codec.py, scipy checks
    # core/linalg.py, osqp checks the solve itself (§13.3).  The last one is
    # the only independent implementation of (P) in the tree -- everything else
    # would validate the active set against itself, which is what makes it the
    # oracle a port has to be checked against.
    "eth-abi>=5,<6",
    "scipy>=1.14",
    "osqp>=1,<2",
    "ruff>=0.6",
]

[project.scripts]
erouter = "erouter.dev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erouter"]

[tool.uv]
package = true
# Nothing published in the last week is a resolution candidate.
#
# A compromised release is usually caught within hours: the arrayref/internment
# incident of 2026-08-20 had its malicious versions live for 86 to 107 minutes
# before crates.io pulled them, and the npm incidents that motivated this ran to
# a few hours.  A cooling-off window costs nothing -- we are not chasing
# same-day releases of anything -- and takes the whole class off the table.
#
# Relative rather than a pinned date, so it stays true without being maintained.
# `uv.lock` is committed, so this only bites when something is deliberately
# re-resolved; `uv sync` installs what the lock already says.
#
# It is not a complete defence: a version that sits quietly for eight days is
# still installable.  See `scripts/check_dependency_age.py`, which enforces the
# same rule on `rust/Cargo.lock`, where Cargo has no equivalent setting yet.
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["forked: needs networks.py and a reachable RPC"]
addopts = "-m 'not forked'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "RET"]
# RUF00x: the spec uses mathematical unicode (nu, psi, sigma) and so do we.
# SIM300: misfires on numpy comparisons -- it wants `floor <= G` where `G < floor`
#         is the readable form.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM300"]
