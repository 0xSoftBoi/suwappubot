[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "erouter-solve"
version = "0.1.0"
description = "The quadratic-flow router's active-set QP, in Rust"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["python", "pyo3/extension-module"]
module-name = "erouter_solve"
