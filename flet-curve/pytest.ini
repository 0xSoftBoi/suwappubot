[pytest]
asyncio_mode = auto
pythonpath = src .
testpaths = tests
markers =
    flet_ui: drives the real UI through Flet's integration-test framework.
        Needs a Flutter test host, which the plugin provisions via flet-cli,
        so these are excluded from the default run. Enable with `-m flet_ui`.
    fork: runs the transactions against a forked mainnet through anvil.
        Needs the anvil binary and an endpoint to fork from, and talks to
        the network, so these are excluded from the default run too.
        Enable with `-m fork`; see tests/fork/conftest.py.
addopts = -m "not flet_ui and not fork"
