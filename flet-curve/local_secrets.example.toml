# Real credentials. Copy to `local_secrets.toml`, which is gitignored.
#
# This file is at the repo ROOT on purpose. `src/local_config.toml` is the
# other one, and it is not a place for secrets: `flet publish` tars the
# script directory into the app, so anything under `src/` is served to
# every visitor -- and `tools/publish_ipfs.py` would pin it to IPFS, which
# has no unpublish. That script refuses to upload a build containing the
# key, but the safe place is here.
#
# The environment wins over this file: PINATA_JWT.

[pinata]
# An API key with `pinFileToIPFS` permission, from
# https://app.pinata.cloud/developers/api-keys -- take the JWT it shows
# once, not the key/secret pair.
jwt = ""

# Optional. Your dedicated gateway, if you have one, for the URL printed
# after a pin: e.g. "https://something.mypinata.cloud/ipfs/". The public
# gateway is used when this is empty.
gateway = ""
