<!--
  WalletConnect mark, for the wallet picker.

  Geometry taken verbatim from @reown/appkit-ui (dist/esm/src/assets/svg/
  walletconnect.js), which is the asset AppKit itself draws in the QR modal.
  The only change is the fill: upstream uses a CSS custom property
  (var(--apkt-tokens-theme-textPrimary)) that resolves to nothing outside
  AppKit's own shadow DOM, so it is pinned to the WalletConnect blue, which
  reads correctly on both light and dark surfaces.

  Shipped as a file rather than an inline data: URI so it stays diffable and
  is served from the app's own origin on web and its assets dir on desktop.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="89" height="89" viewBox="0 0 89 89" fill="none">
  <path
    d="M60.0468 39.2502L65.9116 33.3854C52.6562 20.13 36.1858 20.13 22.9304 33.3854L28.7952 39.2502C38.8764 29.169 49.9725 29.169 60.0536 39.2502H60.0468Z"
    fill="#3B99FC" />
  <path
    d="M58.0927 52.9146L44.415 39.2369L30.7373 52.9146L17.0596 39.2369L11.2017 45.0949L30.7373 64.6374L44.415 50.9597L58.0927 64.6374L77.6284 45.0949L71.7704 39.2369L58.0927 52.9146Z"
    fill="#3B99FC" />
</svg>
