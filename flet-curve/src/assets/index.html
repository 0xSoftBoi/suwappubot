<!DOCTYPE html>
<html>

<head>
  <!--
    Custom Flet index.html. `flet publish` copies src/assets/* over the
    generated web root, so this file replaces the stock one and is the
    supported way to get our own script tag onto the page.

    Three things here are load-bearing and must survive edits, because
    flet_web/patch_index.py rewrites them at publish time:
      1. the base href tag below    - rewritten to match --base-url
      2. the fletAppConfig marker   - replaced with the build config
      3. the "var flet = {...}"     - the config above *mutates* that
         block                        object, so it must come first

    Do not write either marker literally in a comment: the patcher does a
    plain string replace over the whole file, so a mention in prose gets
    substituted too, and an injected comment terminator would end this
    comment early.

    Nor write a comment terminator here in any other way, which is not a
    hypothetical: this comment used to spell one out while warning against
    it. The browser ended the comment there, found bare text inside HEAD,
    and implicitly closed HEAD -- which put the base tag, the title and
    the icon links in BODY, where a favicon link is ignored. The tab fell
    back to /favicon.ico and got a 404. Everything looked right in the
    file and in the DOM; only `document.head.children` gave it away.
    Everything else here is ordinary HTML.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="An alternative Curve Finance UI built with Flet.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Curve">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-192.png?v=1">

  <!-- Both files come from src/assets, which `flet publish` copies over
       the generated web root after Flet's own -- see tools/build_icons.py.

       The `?v=` is not decoration. A browser keeps favicons in a store of
       its own, keyed by URL and quite separate from the page cache, so
       serving this site with `Cache-Control: no-store` does nothing for
       it: a tab that once showed Flet's default goes on showing it
       through reloads. Changing the URL is what a browser notices. Bump
       the number whenever the mark changes.
       The theme colours are what a mobile browser paints its own chrome
       with. Both were sampled off the running app bar rather than guessed:
       the app follows the system theme, so a single value would be wrong
       half the time. -->
  <link rel="icon" type="image/png" href="favicon.png?v=1" />
  <meta name="theme-color" content="#E4E1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#35343A" media="(prefers-color-scheme: dark)">

  <title>Curve Finance</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "/canvaskit/",
      pyodideUrl: "/pyodide/pyodide.mjs",
      webRenderer: "auto",
      fontFallbackBaseUrl: "assets/fonts/",
      appPackageUrl: "app.tar.gz"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });
  </script>

  <!-- fletAppConfig -->

  <script src="python.js"></script>

  <!--
    Wallet connector configuration comes from Python at startup
    (wallet/settings.py -> bridge_configure), so a plain `flet publish`
    yields a configured build with no post-processing step.

    To pin values in the page instead, define window.FLET_PAY here; anything
    set that way wins over what Python sends.
  -->

  <!--
    The wallet bridge. Loaded on the main thread (where window.ethereum
    lives) and long before Pyodide finishes booting, so the Python worker
    always finds it listening. See src/wallet/browser.py for the other end.
  -->
  <script src="wallet_bridge.js"></script>
  <!-- The main-thread half of "save this picture": a worker has no DOM
       to hang an `<a download>` on.  See download_bridge.js. -->
  <script src="download_bridge.js"></script>

  <!--
    Development only: ?mock=1 on localhost loads a fake EIP-6963 wallet, so
    the send flow can be exercised without a real wallet or real money. It
    fabricates mined receipts, and the app auto-connects a lone announced
    wallet, so a published site must not be able to load it at all: the
    host check is here and `publish_ipfs.py` deletes the file as well.
  -->
  <script>
    (function () {
      var local = ["localhost", "127.0.0.1", "[::1]", ""].indexOf(location.hostname) >= 0;
      var asked = new URLSearchParams(location.search).get("mock");
      if (local && asked && asked !== "0" && asked !== "false") {
        document.write('<script src="mock_wallet.js"><\/script>');
      }
    })();
  </script>
</head>

<body>
  <div id="loading">
    <style>
      body {
        inset: 0;
        overflow: hidden;
        margin: 0;
        padding: 0;
        position: fixed;
      }

      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        opacity: .66;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      #loading.init_done img {
        animation: .33s ease-in-out 0s 1 forwards zooooom;
        opacity: .05;
      }

      @keyframes breathe {
        from {
          transform: scale(0.4);
          opacity: 1.0;
        }

        to {
          transform: scale(0.35);
          opacity: .7;
        }
      }

      @keyframes zooooom {
        from {
          transform: scale(0.4)
        }

        to {
          transform: scale(10)
        }
      }
    </style>
    <img src="icons/loading-animation.png" alt="Loading..." />
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
