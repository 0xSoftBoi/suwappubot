limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rate limiting
    limit_req zone=general burst=20 nodelay;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Health check endpoint (exempt from rate limit via zone=0)
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"suwappu-webapp"}';
        add_header Content-Type application/json;
    }

    # Build info endpoint for deployment verification
    location /build-info.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type application/json;
    }

    # Block common scanner paths — close connection immediately
    location ~* ^/(js|public/js|assets/scripts)/ {
        access_log off;
        return 444;
    }

    # Static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.suwappu.bot https://telegram.org wss:; font-src 'self'; frame-ancestors 'self' https://web.telegram.org https://t.me;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
