[package]
name = "suwappu-mpc-signer"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
curve25519-dalek = { version = "4.1", features = ["rand_core", "zeroize"] }
ed25519-dalek = "2.1"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"
