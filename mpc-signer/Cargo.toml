[package]
name = "suwappu-mpc-signer"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
curve25519-dalek = { version = "4.1", features = ["rand_core", "zeroize"] }
ed25519-dalek = "2.1"
fast-paillier = "=0.3.2"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
tempfile = "3.20"

# fast-paillier 0.3.2 currently reaches yanked core2 0.4.0 through
# glass_pumpkin. Pin the exact upstream core2 source commit instead of asking
# Cargo to select a yanked registry release.
[patch.crates-io]
core2 = { git = "https://github.com/bbqsrc/core2", rev = "545e84bcb0f235b12e21351e0c69767958efe2a7" }

[lints.rust]
unsafe_code = "forbid"
