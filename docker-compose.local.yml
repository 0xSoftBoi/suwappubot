version: '3.8'

# Local Docker development environment
# Usage: docker-compose -f docker-compose.local.yml up --build

services:
  bot:
    build: .
    container_name: suwappubot-local
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      - DATABASE_URL=postgresql://suwappubot:${DB_PASSWORD:-localdevpassword}@db:5432/suwappubot?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "10000:10000"
    volumes:
      - ./data:/app/data
    networks:
      - suwappu-local

  db:
    image: postgres:15-alpine
    container_name: suwappubot-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: suwappubot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdevpassword}
      POSTGRES_DB: suwappubot
    ports:
      - "5432:5432"
    volumes:
      - postgres_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suwappubot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suwappu-local

  redis:
    image: redis:7-alpine
    container_name: suwappubot-redis-local
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_local:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suwappu-local

volumes:
  postgres_local:
    driver: local
  redis_local:
    driver: local

networks:
  suwappu-local:
    driver: bridge
