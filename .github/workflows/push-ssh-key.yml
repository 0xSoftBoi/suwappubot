name: Push SSH Public Key to EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-key:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region us-east-1

      - name: Push public key via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=suwappu-bot" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Instance: $INSTANCE_ID"

          PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDCKwsNzP8ps4sJcU9SuOsdAnbsKmXrIIzl9b0GBA58L suwappu-bot"

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"mkdir -p /home/ubuntu/.ssh\",\"echo '$PUB_KEY' >> /home/ubuntu/.ssh/authorized_keys\",\"sort -u -o /home/ubuntu/.ssh/authorized_keys /home/ubuntu/.ssh/authorized_keys\",\"chown -R ubuntu:ubuntu /home/ubuntu/.ssh\",\"chmod 700 /home/ubuntu/.ssh\",\"chmod 600 /home/ubuntu/.ssh/authorized_keys\",\"echo done\"]}" \
            --comment "Push local SSH key" \
            --query 'Command.CommandId' --output text

          echo "Waiting for command..."
          sleep 10
          echo "Done. Try: ssh -i ~/.ssh/suwappu-bot-key ubuntu@23.21.184.77"
