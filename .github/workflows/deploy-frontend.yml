name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      target:
        description: Frontend target to deploy
        required: true
        default: showcase
        type: choice
        options:
          - showcase
          - terminal
          - all

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-${{ github.event.inputs.target }}
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "905418423235"
  AWS_REGION: us-east-1
  ECS_CLUSTER: suwappu-cluster
  SHOWCASE_REPOSITORY: suwappu-showcase
  SHOWCASE_SERVICE: suwappu-showcase
  TERMINAL_REPOSITORY: suwappu-terminal
  TERMINAL_SERVICE: suwappu-terminal-prod

jobs:
  deploy-showcase:
    name: Deploy Showcase
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target == 'showcase' || github.event.inputs.target == 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push showcase image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${SHOWCASE_REPOSITORY}"

          docker build \
            --platform linux/amd64 \
            -f showcase/Dockerfile \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:latest" \
            showcase/

          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

      - name: Redeploy showcase service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --service "${SHOWCASE_SERVICE}" \
            --force-new-deployment

          aws ecs wait services-stable \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${SHOWCASE_SERVICE}"

      - name: Verify showcase
        run: |
          set -euo pipefail
          curl -fsS https://suwappu.bot/ >/tmp/showcase.html
          grep -q "Open Terminal" /tmp/showcase.html
          grep -q "summer-page" /tmp/showcase.html

  deploy-terminal:
    name: Deploy Terminal
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target == 'terminal' || github.event.inputs.target == 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push terminal image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_WC_PROJECT_ID: ${{ secrets.VITE_WC_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${TERMINAL_REPOSITORY}"

          docker build \
            --platform linux/amd64 \
            -f terminal/Dockerfile \
            --build-arg VITE_API_URL=https://api.suwappu.bot \
            --build-arg VITE_WC_PROJECT_ID="${VITE_WC_PROJECT_ID:-}" \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:latest" \
            .

          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

      - name: Redeploy terminal service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --service "${TERMINAL_SERVICE}" \
            --force-new-deployment

          aws ecs wait services-stable \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${TERMINAL_SERVICE}"

      - name: Verify terminal
        run: |
          set -euo pipefail
          curl -fsS https://terminal.suwappu.bot/health
