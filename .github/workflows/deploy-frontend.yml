name: Deploy Frontend

# NOTE: the trading terminal moved to Railway (railway.terminal.json, auto-deploys
# on push to main). Only the showcase site still deploys to ECS via this workflow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Frontend target to deploy
        required: true
        default: showcase
        type: choice
        options:
          - showcase

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend-${{ github.event.inputs.target }}
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: "905418423235"
  AWS_REGION: us-east-1
  ECS_CLUSTER: suwappu-cluster
  SHOWCASE_REPOSITORY: suwappu-showcase
  SHOWCASE_SERVICE: suwappu-showcase

jobs:
  deploy-showcase:
    name: Deploy Showcase
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.target == 'showcase' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push showcase image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${SHOWCASE_REPOSITORY}"

          docker build \
            --platform linux/amd64 \
            -f showcase/Dockerfile \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:latest" \
            showcase/

          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

      - name: Redeploy showcase service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --service "${SHOWCASE_SERVICE}" \
            --force-new-deployment

          aws ecs wait services-stable \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${SHOWCASE_SERVICE}"

      - name: Verify showcase
        run: |
          set -euo pipefail
          curl -fsS https://suwappu.bot/ >/tmp/showcase.html
          grep -q "Open Terminal" /tmp/showcase.html
          grep -q "summer-page" /tmp/showcase.html
