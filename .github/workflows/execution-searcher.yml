name: Execution Searcher

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "execution/searcher/**"
      - ".github/workflows/execution-searcher.yml"
  push:
    branches:
      - main
      - dev
      - "execution/**"
    paths:
      - "execution/searcher/**"
      - ".github/workflows/execution-searcher.yml"

concurrency:
  group: execution-searcher-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Deterministic measurement engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: execution/searcher
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: execution/searcher
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
