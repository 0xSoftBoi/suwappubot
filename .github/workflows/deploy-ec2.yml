name: Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'api/**'
      - 'database/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'suwappubot.service'
      - '.github/workflows/deploy-ec2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /home/ubuntu/suwappubot

            echo "=== Pulling latest code ==="
            git fetch origin
            git reset --hard origin/main

            echo "=== Installing dependencies ==="
            ./venv/bin/pip install -r requirements.txt -q 2>&1 | tail -5

            echo "=== Refreshing secrets ==="
            sudo bash scripts/pull-secrets.sh

            echo "=== Updating systemd service ==="
            sudo cp suwappubot.service /etc/systemd/system/suwappubot.service
            sudo systemctl daemon-reload

            echo "=== Restarting bot ==="
            sudo systemctl restart suwappubot

            echo "=== Waiting for startup ==="
            sleep 8

            echo "=== Health check ==="
            for i in 1 2 3 4 5; do
              HEALTH=$(curl -sf http://localhost:10000/health 2>/dev/null || echo '{}')
              STATUS=$(echo "$HEALTH" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status","unknown"))' 2>/dev/null || echo "unknown")
              BOT=$(echo "$HEALTH" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("bot","unknown"))' 2>/dev/null || echo "unknown")
              DB=$(echo "$HEALTH" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("database","unknown"))' 2>/dev/null || echo "unknown")
              echo "Attempt $i: status=$STATUS bot=$BOT db=$DB"
              if [ "$STATUS" = "healthy" ] && [ "$BOT" = "polling" ]; then
                echo "Deploy successful!"
                exit 0
              fi
              sleep 5
            done

            echo "Deploy FAILED — dumping logs:"
            sudo journalctl -u suwappubot --no-pager -n 40
            exit 1

      - name: Summary
        if: always()
        run: |
          echo "## EC2 Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
