name: Secret scan

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so newly-introduced secrets in older commits are caught too.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action is free for public repositories.
          # Private/org repos need GITLEAKS_LICENSE set as a repo secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
