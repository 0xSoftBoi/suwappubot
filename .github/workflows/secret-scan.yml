# Secret scanning — gitleaks over the full history on every push/PR.
#
# Rationale: Meli et al. (NDSS 2019) measured that credentials pushed to
# public GitHub are exploited by automated scanners within minutes; an
# explicit CI gate is the cheapest control (docs/research/
# academic-improvements-2026-08.md, Track 3 #5). GitHub-native secret
# scanning covers known provider patterns post-push; this gate blocks
# the merge itself and also catches generic high-entropy secrets.
#
# The gitleaks binary is downloaded from its release and verified
# against a pinned sha256 (no third-party action), matching this repo's
# pin-everything convention. Repo-specific allowlist: .gitleaks.toml.

name: secret-scan

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so leaks in old commits are caught

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          VERSION=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan repository history
        run: gitleaks git --config .gitleaks.toml --redact --verbose .
