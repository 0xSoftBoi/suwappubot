name: Tests & Quality Gates

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are noise. Main/dev runs are deployment evidence and must
  # finish so Railway's Wait for CI can make a decision for each pushed commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected CI lanes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.domains.outputs.python }}
      api_ts: ${{ steps.domains.outputs.api_ts }}
      terminal: ${{ steps.domains.outputs.terminal }}
      mobile: ${{ steps.domains.outputs.mobile }}
      showcase: ${{ steps.domains.outputs.showcase }}
      migration: ${{ steps.domains.outputs.migration }}
      docs: ${{ steps.domains.outputs.docs }}
      sdk: ${{ steps.domains.outputs.sdk }}
      webapp: ${{ steps.domains.outputs.webapp }}
      dependencies: ${{ steps.domains.outputs.dependencies }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - id: domains
        name: Calculate changed domains
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_changed_domains.py --base "$BASE_SHA" --head "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  deployment-contract:
    name: Railway deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/validate_railway_services.py

  # ---------------------------------------------------------------------------
  # Python — lint, type-check, tests, coverage
  # ---------------------------------------------------------------------------
  python-quality:
    name: Python quality
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: test-token
      ENCRYPTION_KEY: test-encryption-key-32byteslong!!
      DATABASE_URL: "sqlite:///test.db"
      KMS_PROVIDER: dev
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # Runtime deps from the source-of-truth requirements.txt (same file prod
          # Docker installs), plus test/lint tooling which lives outside it.
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov black flake8

      - name: Format check (black)
        run: black --check --line-length=100 bot/ api/ tests/

      - name: Lint (flake8)
        run: flake8 bot/ api/ tests/ --max-line-length=100 --extend-ignore=E501,W503
        continue-on-error: true   # advisory by choice — flake8 findings are informational, not blocking

      - name: Env contract drift check (.env.schema)
        run: python3 scripts/check_env_schema.py

      # Blocking. A card whose fill points at a renamed gradient renders black in
      # every wallet and marketplace, raises nothing, and stays wrong until a human
      # happens to look at it — the visual equivalent of the boot-import crash CI
      # already cannot catch. Stdlib only, so it needs no extra install step.
      #
      # Scoped to nft/ (mint assets) rather than art/. The size budget it enforces is
      # a wallet/marketplace constraint on minted SVG; art/ holds posters and
      # generative pieces that are not minted and that the budget would wrongly fail.
      - name: Generated-asset gate (SVG)
        run: python3 scripts/art/validate_asset.py nft --quiet

      # Advisory. A heuristic report on money handled outside Decimal and aggregates
      # missing a success predicate; it has known false positives, so gating on it
      # would only train people to ignore it.
      - name: Money precision report
        run: python3 scripts/audit/money_precision_scan.py --limit 15
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=bot --cov=api \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=20 \
            -q
        # Floor = current measured coverage (~20 %), set once tests actually ran.
        # Ratchet up ~10 pp each sprint toward 70 % as tests are added.

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # TypeScript — type-check, tests
  # ---------------------------------------------------------------------------
  typescript-quality:
    name: TypeScript quality
    needs: changes
    if: needs.changes.outputs.api_ts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-ts
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14   # pinned: stable cache key avoids re-downloading Bun on every run

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check (tsc --noEmit)
        run: bun run check

      - name: OpenAPI spec drift check
        run: bun run check:openapi

      - name: MCP schema drift check
        run: bun run check:mcp

      - name: Run TypeScript tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

  # ---------------------------------------------------------------------------
  # Terminal — unit tests + the exact Vite production compile
  # ---------------------------------------------------------------------------
  terminal-production-build:
    name: Terminal production build
    needs: changes
    if: needs.changes.outputs.terminal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install terminal dependencies
        run: bun install --frozen-lockfile

      - name: Run terminal unit tests
        run: bun run test

      - name: Build terminal production bundle
        run: bun run build

  # ---------------------------------------------------------------------------
  # Gecko mobile — native client type contract
  # ---------------------------------------------------------------------------
  mobile-quality:
    name: Gecko mobile quality
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check native client
        run: bun run check

      - name: Run native client tests
        run: bun run test

      - name: Export production iOS bundle
        run: node ./node_modules/expo/bin/cli export --platform ios --clear

  ios-native-build:
    name: Gecko iOS native build (Xcode 26)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate native iOS project
        run: node ./node_modules/expo/bin/cli prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Compile unsigned Release app for iOS device
        run: >-
          xcodebuild
          -workspace ios/Gecko.xcworkspace
          -scheme Gecko
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

  # ---------------------------------------------------------------------------
  # Deployment contracts — exact production build + shared-DB migration safety
  # ---------------------------------------------------------------------------
  showcase-production-build:
    name: Showcase production build
    needs: changes
    if: needs.changes.outputs.showcase == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Published product numbers are derived from bot/ and api-ts/ sources.
      # The path selector includes those exact source files in this lane.
      - name: Showcase stats drift check
        run: bun run stats:check

      - name: Build with the Railway production command
        run: bun run build

  api-ts-shared-db-migration:
    name: API shared-DB migration contract
    needs: changes
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: suwappu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d suwappu_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Reproduce Python-owned recovery column before Drizzle migration
        run: >-
          docker run --rm --network host
          -e PGPASSWORD=postgres
          postgres:18
          psql -h 127.0.0.1 -U postgres -d suwappu_ci
          -v ON_ERROR_STOP=1
          -c 'CREATE TABLE public.users (id serial PRIMARY KEY, recovery_email varchar(255));'

      - name: Apply passkey migration twice
        run: |
          for attempt in 1 2; do
            docker run --rm --network host \
              -e PGPASSWORD=postgres \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              postgres:18 \
              psql -h 127.0.0.1 -U postgres -d suwappu_ci \
              -v ON_ERROR_STOP=1 \
              -f /workspace/api-ts/drizzle/0017_condemned_clea.sql
          done

  # ---------------------------------------------------------------------------
  # Builder docs — generated artifacts + executable-source contracts
  # ---------------------------------------------------------------------------
  docs-contract:
    name: Builder docs contract
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Generate docs and verify API/docs authority boundaries
        working-directory: showcase
        run: |
          node scripts/regen-docs.mjs # exits nonzero if SUMMARY targets are missing or empty
          node scripts/gen-llms.mjs
          node scripts/check-doc-contract.mjs

      - name: Generated docs are committed
        run: git diff --exit-code -- showcase/src/data/docs.json showcase/public/llms.txt showcase/public/llms-full.txt

  # ---------------------------------------------------------------------------
  # SDKs — test what users can actually install, not only source files
  # ---------------------------------------------------------------------------
  sdk-package-contract:
    name: SDK package contract
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run shared TypeScript package release contract
        run: bash scripts/verify-ts-packages.sh

      - name: Test, build, and clean-install Python SDK
        run: |
          python -m venv "$RUNNER_TEMP/python-test"
          "$RUNNER_TEMP/python-test/bin/pip" install --upgrade pip build
          "$RUNNER_TEMP/python-test/bin/pip" install -e './packages/sdk-python[dev]'
          "$RUNNER_TEMP/python-test/bin/python" -m pytest packages/sdk-python/tests -q
          "$RUNNER_TEMP/python-test/bin/python" -m build packages/sdk-python --outdir "$RUNNER_TEMP/python-dist"
          python -m venv "$RUNNER_TEMP/python-consumer"
          "$RUNNER_TEMP/python-consumer/bin/pip" install "$RUNNER_TEMP"/python-dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/python-consumer/bin/python" -c "from suwappu import create_client; assert callable(create_client)"

  # ---------------------------------------------------------------------------
  # Webapp — unit tests (Telegram Mini App)
  # ---------------------------------------------------------------------------
  webapp-quality:
    name: Webapp quality
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # `npm run test` shells out to `bun test` under the hood (see
      # webapp/package.json) — setup-node's npm cache doesn't provide a bun
      # runtime, so it must be installed explicitly.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14   # pinned: stable cache key avoids re-downloading Bun on every run

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run
        # test:integration is deliberately excluded here — it hits the live
        # devapi.suwappu.bot over the network and isn't self-contained/CI-safe.

  # ---------------------------------------------------------------------------
  # Security — dependency scanning
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency security scan
    needs: changes
    if: needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Audit the exact locked graph that the Python service installs. Running
      # bare pip-audit here audits the runner/tool environment instead.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python dependency audit (locked application graph)
        id: python-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        continue-on-error: true
        with:
          inputs: requirements.txt
          # Time-bounded, evidence-backed exception; see
          # docs/security/dependency-exceptions.md.
          ignore-vulns: PYSEC-2026-1325

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14   # pinned: stable cache key avoids re-downloading Bun on every run

      # These packages use bun.lock as their dependency authority. Keep going
      # after one failure so a single CI run reports every affected workspace,
      # then fail the job if any high/critical advisory was found.
      - name: Bun dependency audits (locked workspaces)
        id: bun-audit
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          status=0
          for dir in \
            api-ts \
            terminal \
            showcase \
            extension \
            packages/sdk \
            packages/mcp-server \
            packages/openclaw \
            packages/design-tokens
          do
            echo "::group::bun audit ($dir)"
            (cd "$dir" && bun audit --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit "$status"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # webapp intentionally uses npm/package-lock.json in its quality and
      # production install path, so audit that lock with npm rather than Bun.
      - name: Webapp dependency audit (npm lock)
        id: npm-audit
        continue-on-error: true
        working-directory: webapp
        run: npm audit --audit-level=high

      # Audit steps continue long enough to report the complete dependency
      # surface, but the job remains blocking unless all three completed cleanly.
      - name: Enforce dependency audit results
        if: always()
        env:
          PYTHON_AUDIT: ${{ steps.python-audit.outcome }}
          BUN_AUDIT: ${{ steps.bun-audit.outcome }}
          NPM_AUDIT: ${{ steps.npm-audit.outcome }}
        run: |
          status=0
          if [[ "$PYTHON_AUDIT" != "success" ]]; then
            echo "::error::Python locked dependency audit: $PYTHON_AUDIT"
            status=1
          fi
          if [[ "$BUN_AUDIT" != "success" ]]; then
            echo "::error::Bun workspace dependency audits: $BUN_AUDIT"
            status=1
          fi
          if [[ "$NPM_AUDIT" != "success" ]]; then
            echo "::error::Webapp npm dependency audit: $NPM_AUDIT"
            status=1
          fi
          exit "$status"

  # This is the only check branch rules and Railway need to require. It always
  # exists, even when every expensive lane is correctly skipped.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - deployment-contract
      - python-quality
      - typescript-quality
      - terminal-production-build
      - mobile-quality
      - ios-native-build
      - showcase-production-build
      - api-ts-shared-db-migration
      - docs-contract
      - sdk-package-contract
      - webapp-quality
      - dependency-scan
    runs-on: ubuntu-latest
    env:
      CHANGES: ${{ needs.changes.result }}
      DEPLOYMENT: ${{ needs.deployment-contract.result }}
      PYTHON: ${{ needs.python-quality.result }}
      API_TS: ${{ needs.typescript-quality.result }}
      TERMINAL: ${{ needs.terminal-production-build.result }}
      MOBILE: ${{ needs.mobile-quality.result }}
      IOS: ${{ needs.ios-native-build.result }}
      SHOWCASE: ${{ needs.showcase-production-build.result }}
      MIGRATION: ${{ needs.api-ts-shared-db-migration.result }}
      DOCS: ${{ needs.docs-contract.result }}
      SDK: ${{ needs.sdk-package-contract.result }}
      WEBAPP: ${{ needs.webapp-quality.result }}
      DEPENDENCIES: ${{ needs.dependency-scan.result }}
    steps:
      - name: Enforce selected job results
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for name in CHANGES DEPLOYMENT PYTHON API_TS TERMINAL MOBILE IOS SHOWCASE MIGRATION DOCS SDK WEBAPP DEPENDENCIES; do
            result="${!name}"
            printf '%-14s %s\n' "$name" "$result"
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
