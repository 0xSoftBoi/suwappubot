name: Execution Format Once

on:
  push:
    branches:
      - "execution/pamm-controller-sprint2"
    paths:
      - "execution/**"
      - ".github/workflows/execution-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: execution/pamm-controller-sprint2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Canonical formatting
        run: |
          cargo fmt --manifest-path execution/searcher/Cargo.toml
          (cd execution/executor-bench && forge fmt)
          (cd execution/pamm-contract && forge fmt)
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- execution; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add execution
          git commit -m "style(execution): apply canonical formatters"
          git push origin HEAD:execution/pamm-controller-sprint2
