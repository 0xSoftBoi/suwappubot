name: Refresh Env Schema

on:
  push:
    branches:
      - feat/execution-sync-shadow
    paths:
      - '.github/workflows/execution-sync-env-schema.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/execution-sync-shadow
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Regenerate env schema
        run: python3 scripts/check_env_schema.py --write
      - name: Commit generated schema
        run: |
          if git diff --quiet -- .env.schema; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.schema
          git commit -m 'chore: refresh generated env schema'
          git push origin HEAD:feat/execution-sync-shadow
