name: Debug Bot Status

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: suwappu-cluster

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    name: Check Bot Status
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ECS service status
        run: |
          echo "=== Service Status ==="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services suwappu-bot-prod \
            --query 'services[0].{status:status,desiredCount:desiredCount,runningCount:runningCount,taskDefinition:taskDefinition,deployments:deployments}' \
            --output json

      - name: List recent tasks
        run: |
          echo "=== Recent Tasks ==="
          TASK_ARNS=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name suwappu-bot-prod \
            --query 'taskArns' \
            --output json)
          echo "$TASK_ARNS"

          if [ "$TASK_ARNS" != "[]" ]; then
            aws ecs describe-tasks \
              --cluster ${{ env.ECS_CLUSTER }} \
              --tasks $(echo "$TASK_ARNS" | python3 -c "import sys,json; print(' '.join(json.load(sys.stdin)))") \
              --query 'tasks[*].{taskArn:taskArn,lastStatus:lastStatus,stoppedReason:stoppedReason,containers:containers[*].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
              --output json
          fi

      - name: Get task definition details
        run: |
          echo "=== Task Definition ==="
          TASK_DEF=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services suwappu-bot-prod \
            --query 'services[0].taskDefinition' \
            --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF" \
            --query 'taskDefinition.containerDefinitions[*].{name:name,image:image,logConfiguration:logConfiguration}' \
            --output json

      - name: Check CloudWatch logs
        run: |
          echo "=== Recent Bot Logs ==="
          # List log streams to find the active one
          echo "--- Log streams in /ecs/suwappu-bot ---"
          aws logs describe-log-streams \
            --log-group-name /ecs/suwappu-bot \
            --order-by LastEventTime \
            --descending \
            --limit 5 \
            --query 'logStreams[*].{name:logStreamName,lastEvent:lastEventTimestamp}' \
            --output json 2>&1 || echo "Could not list log streams"

          echo ""
          echo "--- Latest logs ---"
          aws logs get-log-events \
            --log-group-name /ecs/suwappu-bot \
            --log-stream-name "$(aws logs describe-log-streams --log-group-name /ecs/suwappu-bot --order-by LastEventTime --descending --limit 1 --query 'logStreams[0].logStreamName' --output text 2>/dev/null)" \
            --limit 50 \
            --query 'events[*].message' \
            --output json 2>&1 | python3 -c "import sys,json; [print(m) for m in json.load(sys.stdin)]" 2>&1 || echo "Could not read logs"

      - name: Check target group health
        continue-on-error: true
        run: |
          echo "=== Target Group Health ==="
          TG_ARN=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services suwappu-bot-prod \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text 2>/dev/null)
          echo "Target group: $TG_ARN"
          aws elbv2 describe-target-health --target-group-arn "$TG_ARN" --output json 2>&1 || echo "No access to ELB"

      - name: ECS Exec into container
        continue-on-error: true
        run: |
          echo "=== ECS Exec - Check process and curl health ==="
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name suwappu-bot-prod \
            --query 'taskArns[0]' \
            --output text)

          # Try running a health check from inside the container
          aws ecs execute-command \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task "$TASK_ARN" \
            --container suwappu-bot \
            --interactive \
            --command "curl -sf http://localhost:10000/health" 2>&1 || echo "ECS Exec failed (may need session manager plugin)"

      - name: Check service events
        run: |
          echo "=== Service Events (last 10) ==="
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services suwappu-bot-prod \
            --query 'services[0].events[:10]' \
            --output json

      - name: Check bot health endpoint directly
        run: |
          echo "=== Direct Health Check ==="
          # Get the task's ENI/IP
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service-name suwappu-bot-prod \
            --query 'taskArns[0]' \
            --output text)

          TASK_DETAILS=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "$TASK_ARN" \
            --query 'tasks[0]' \
            --output json)

          ENI_ID=$(echo "$TASK_DETAILS" | python3 -c "
          import sys,json
          t = json.load(sys.stdin)
          for a in t.get('attachments', []):
            for d in a.get('details', []):
              if d.get('name') == 'networkInterfaceId':
                print(d['value'])
                break
          " 2>/dev/null)

          if [ -n "$ENI_ID" ]; then
            PUBLIC_IP=$(aws ec2 describe-network-interfaces \
              --network-interface-ids "$ENI_ID" \
              --query 'NetworkInterfaces[0].Association.PublicIp' \
              --output text 2>/dev/null)
            PRIVATE_IP=$(aws ec2 describe-network-interfaces \
              --network-interface-ids "$ENI_ID" \
              --query 'NetworkInterfaces[0].PrivateIpAddress' \
              --output text 2>/dev/null)
            echo "Public IP: $PUBLIC_IP"
            echo "Private IP: $PRIVATE_IP"
            echo ""
            echo "Checking http://$PUBLIC_IP:10000/health ..."
            curl -sf --connect-timeout 5 "http://$PUBLIC_IP:10000/health" 2>&1 && echo "OK" || echo "Failed"
          fi

          echo ""
          echo "=== DNS check ==="
          nslookup bot.suwappu.bot 2>&1 || echo "DNS lookup failed"

          echo ""
          echo "=== curl https://bot.suwappu.bot/health ==="
          curl -v --connect-timeout 10 "https://bot.suwappu.bot/health" 2>&1 || echo "Failed"
