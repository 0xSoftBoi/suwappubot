name: Black Diff Diagnostic

on:
  push:
    branches:
      - feat/terminal-execution-lifecycle-892-pr

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install black==26.5.1
      - name: Print formatter diff
        run: black --diff --line-length=100 bot/services/tx_poller.py tests/test_legacy_swap_execution_adapter.py
