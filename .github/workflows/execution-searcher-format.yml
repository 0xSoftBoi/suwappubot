name: One-shot Execution Formatter

on:
  push:
    branches:
      - execution/pamm-searcher-research
    paths:
      - '.github/workflows/execution-searcher-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: execution/pamm-searcher-research
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Apply canonical formatters
        run: |
          (cd execution/searcher && cargo fmt)
          (cd execution/executor-bench && forge fmt)
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/execution-searcher-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(execution): apply canonical formatters'
          git push origin HEAD:execution/pamm-searcher-research
