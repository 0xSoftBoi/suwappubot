name: Fix RDS Security Group for EC2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region us-east-1

      - name: Fix networking
        run: |
          # Get EC2 info
          EC2_INFO=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=suwappu-bot" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].{SG:SecurityGroups[0].GroupId,Subnet:SubnetId,VPC:VpcId,IP:PrivateIpAddress}' --output json)
          echo "EC2: $EC2_INFO"

          EC2_SG=$(echo "$EC2_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['SG'])")
          EC2_VPC=$(echo "$EC2_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['VPC'])")
          EC2_SUBNET=$(echo "$EC2_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['Subnet'])")
          EC2_IP=$(echo "$EC2_INFO" | python3 -c "import sys,json; print(json.load(sys.stdin)['IP'])")
          echo "EC2 SG: $EC2_SG, VPC: $EC2_VPC, Subnet: $EC2_SUBNET, IP: $EC2_IP"

          # List ALL security groups in VPC
          echo ""
          echo "=== All security groups ==="
          aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$EC2_VPC" \
            --query 'SecurityGroups[*].{ID:GroupId,Name:GroupName,Desc:Description}' --output table

          # Find RDS SG (try multiple patterns)
          RDS_SG=$(aws rds describe-db-instances \
            --query 'DBInstances[0].VpcSecurityGroups[0].VpcSecurityGroupId' --output text 2>/dev/null || echo "None")
          echo ""
          echo "RDS SG from RDS API: $RDS_SG"

          if [ "$RDS_SG" != "None" ] && [ -n "$RDS_SG" ]; then
            echo "Adding SG-based rule..."
            aws ec2 authorize-security-group-ingress \
              --group-id "$RDS_SG" \
              --protocol tcp --port 5432 \
              --source-group "$EC2_SG" 2>&1 || echo "(may already exist)"

            echo "Adding IP-based rule as backup..."
            aws ec2 authorize-security-group-ingress \
              --group-id "$RDS_SG" \
              --protocol tcp --port 5432 \
              --cidr "${EC2_IP}/32" 2>&1 || echo "(may already exist)"

            # Also allow entire VPC CIDR for safety
            VPC_CIDR=$(aws ec2 describe-vpcs --vpc-ids "$EC2_VPC" --query 'Vpcs[0].CidrBlock' --output text)
            echo "Adding VPC CIDR rule ($VPC_CIDR)..."
            aws ec2 authorize-security-group-ingress \
              --group-id "$RDS_SG" \
              --protocol tcp --port 5432 \
              --cidr "$VPC_CIDR" 2>&1 || echo "(may already exist)"
          fi

          # Check route tables - can public subnet reach isolated?
          echo ""
          echo "=== Route table for EC2 subnet ==="
          RT_ID=$(aws ec2 describe-route-tables \
            --filters "Name=association.subnet-id,Values=$EC2_SUBNET" \
            --query 'RouteTables[0].RouteTableId' --output text)

          if [ "$RT_ID" == "None" ]; then
            RT_ID=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$EC2_VPC" "Name=association.main,Values=true" \
              --query 'RouteTables[0].RouteTableId' --output text)
          fi

          aws ec2 describe-route-tables \
            --route-table-ids "$RT_ID" \
            --query 'RouteTables[0].Routes' --output table 2>/dev/null || echo "Could not get routes"

          echo ""
          echo "=== RDS endpoint ==="
          aws rds describe-db-instances \
            --query 'DBInstances[0].{Endpoint:Endpoint.Address,Port:Endpoint.Port,Subnets:DBSubnetGroup.Subnets[*].SubnetIdentifier}' --output json

          echo ""
          echo "Done! Restart suwappubot on EC2."
