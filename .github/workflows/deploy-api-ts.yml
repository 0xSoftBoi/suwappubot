name: Deploy API-TS to AWS ECS

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'api-ts/**'
      - '.github/workflows/deploy-api-ts.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'development'
        type: choice
        options:
          - production
          - development

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: suwappu-api-ts
  ECS_CLUSTER: suwappu-cluster

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy API-TS
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/main' || inputs.environment == 'production') && 'production' || 'development' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ inputs.environment }}" == "production" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "ECS_SERVICE=suwappu-api-ts-prod" >> $GITHUB_OUTPUT
            echo "API_URL=https://api.suwappu.bot" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=production" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=development" >> $GITHUB_OUTPUT
            echo "ECS_SERVICE=suwappu-api-ts-dev" >> $GITHUB_OUTPUT
            echo "API_URL=https://devapi.suwappu.bot" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=development" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repository if not exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} || \
          aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }}

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: api-ts
        run: |
          # Build the Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          # Tag with environment
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.env.outputs.IMAGE_TAG }}

          # Push SHA and environment tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.env.outputs.IMAGE_TAG }}

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Run pre-deploy database backup
        continue-on-error: true
        run: |
          echo "Starting database backup before deploy..."
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition suwappu-db-backup \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP_ID }}]}" \
            --overrides '{"containerOverrides":[{"name":"backup","environment":[{"name":"BACKUP_PREFIX","value":"pre-deploy/api-ts"}]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Backup task started: ${TASK_ARN}"
          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks "${TASK_ARN}"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "${EXIT_CODE}" != "0" ]; then
            echo "::error::Database backup failed with exit code ${EXIT_CODE}"
            exit 1
          fi
          echo "Database backup completed successfully."

      - name: Deploy to ECS
        run: |
          echo "Deploying to ${{ steps.env.outputs.ENVIRONMENT }} environment..."
          echo "Cluster: ${{ env.ECS_CLUSTER }}"
          echo "Service: ${{ steps.env.outputs.ECS_SERVICE }}"

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ steps.env.outputs.ECS_SERVICE }} \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true}" \
            --enable-execute-command \
            --force-new-deployment

          echo "Deployment initiated with circuit breaker enabled. Waiting for service to stabilize..."

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ steps.env.outputs.ECS_SERVICE }}

          echo "Deployment complete!"

      - name: Health check
        run: |
          echo "Checking health endpoint..."
          sleep 10
          curl -sf "${{ steps.env.outputs.API_URL }}/health" || echo "Health check pending (service may still be starting)"

      - name: Deployment summary
        run: |
          echo "## API-TS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ steps.env.outputs.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.build-image.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ECS Cluster | ${{ env.ECS_CLUSTER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ECS Service | ${{ steps.env.outputs.ECS_SERVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API URL | ${{ steps.env.outputs.API_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
