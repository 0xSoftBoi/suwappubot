name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'development'
        type: choice
        options:
          - production
          - development

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: suwappu
  ECS_CLUSTER: suwappu-cluster

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set environment variables
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] || [ "${{ inputs.environment }}" == "production" ]; then
            echo "ENVIRONMENT=production" >> $GITHUB_OUTPUT
            echo "ECS_SERVICE=suwappu-bot-prod" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=development" >> $GITHUB_OUTPUT
            echo "ECS_SERVICE=suwappu-bot-dev" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          # Tag with environment
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.env.outputs.ENVIRONMENT }}

          # Push SHA and environment tags
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ steps.env.outputs.ENVIRONMENT }}

          # Only push latest for development (production should use SHA for traceability)
          if [ "${{ steps.env.outputs.ENVIRONMENT }}" != "production" ]; then
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          fi

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Migrations skipped - RDS is in private VPC, run from ECS task if needed

      - name: Deploy to ECS
        run: |
          echo "Deploying to ${{ steps.env.outputs.ENVIRONMENT }} environment..."
          echo "Service: ${{ steps.env.outputs.ECS_SERVICE }}"

          # Check if service exists
          if ! aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ steps.env.outputs.ECS_SERVICE }} --region ${{ env.AWS_REGION }} --query 'services[0].status' --output text | grep -q "ACTIVE"; then
            echo "Error: Service ${{ steps.env.outputs.ECS_SERVICE }} not found or not active in cluster ${{ env.ECS_CLUSTER }}"
            exit 1
          fi

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ steps.env.outputs.ECS_SERVICE }} \
            --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true}" \
            --force-new-deployment

          echo "Deployment initiated with circuit breaker enabled. Waiting for service to stabilize..."

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ steps.env.outputs.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "Deployment complete!"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ steps.env.outputs.ENVIRONMENT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.build-image.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ECS Service | ${{ steps.env.outputs.ECS_SERVICE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations | ${{ steps.db-creds.outputs.SKIP_MIGRATIONS == 'true' && 'Skipped' || 'Applied' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
