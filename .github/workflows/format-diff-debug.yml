name: Black Format Diff Debug

on:
  pull_request:
    branches: [main]

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Black
        run: pip install black==26.5.1
      - name: Print exact formatter diff
        run: black --diff --check --line-length=100 bot/services/execution_reconciler.py tests/test_execution_reconciler.py
