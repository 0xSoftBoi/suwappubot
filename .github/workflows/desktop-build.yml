name: Desktop Build

on:
  push:
    branches: [main, dev]
    paths:
      - 'desktop/**'
      - 'webapp/**'
      - '.github/workflows/desktop-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'webapp/**'

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS/Windows removed — 10x cost multiplier on private repo
          # Trigger manually via workflow_dispatch for release builds
          - os: ubuntu-22.04
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for webapp build)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install webapp dependencies
        run: cd webapp && npm ci

      - name: Install desktop dependencies
        run: cd desktop && bun install

      - name: Build webapp
        run: cd desktop && bash scripts/build-webapp.sh
        env:
          VITE_API_URL: https://api.suwappu.bot
          VITE_TURNKEY_RP_ID: app.suwappu.bot

      - name: Build desktop app (canary)
        if: github.ref != 'refs/heads/main'
        run: cd desktop && bun run build:canary

      - name: Build desktop app (stable)
        if: github.ref == 'refs/heads/main'
        run: cd desktop && bun run build:stable

      - name: macOS codesign
        if: matrix.platform == 'macos' && github.ref == 'refs/heads/main'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "Codesign and notarization would run here"
          echo "Requires APPLE_CERTIFICATE, APPLE_TEAM_ID secrets to be configured"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suwappu-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/artifacts/

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "channel=stable" >> $GITHUB_OUTPUT
          else
            echo "channel=canary" >> $GITHUB_OUTPUT
          fi

      - name: Upload to S3
        run: |
          CHANNEL="${{ steps.channel.outputs.channel }}"
          aws s3 sync artifacts/ "s3://suwappu-desktop-releases/${CHANNEL}/" \
            --delete \
            --cache-control "public, max-age=300"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: Suwappu Desktop v${{ github.run_number }}
          draft: true
          files: artifacts/**/*
