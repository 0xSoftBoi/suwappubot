name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      api-ts: ${{ steps.filter.outputs.api-ts }}
      webapp: ${{ steps.filter.outputs.webapp }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bot:
              - 'bot/**'
              - 'api/**'
              - 'database/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'pyproject.toml'
            api-ts:
              - 'api-ts/**'
            webapp:
              - 'webapp/**'

  bot-checks:
    name: Bot lint & test
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake make libpq-dev libssl-dev

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check bot/ api/ database/ tests/

      - name: Run unit tests
        run: |
          pytest tests/ --ignore=tests/integration -x --timeout=30

  api-ts-checks:
    name: API-TS lint & typecheck
    needs: changes
    if: needs.changes.outputs.api-ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd api-ts && bun install

      - name: Typecheck
        run: cd api-ts && bun run check

      - name: Lint with Biome
        run: cd api-ts && bunx @biomejs/biome check src/

  webapp-checks:
    name: Webapp lint, build & test
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd webapp && bun install

      - name: Lint
        run: cd webapp && npm run lint

      - name: Build
        run: cd webapp && npm run build

      - name: Test
        run: cd webapp && bun test src/hooks src/lib --preload ./src/test/happy-dom-setup.ts
