name: Health Check

# One of TWO independent schedulers running the same probe
# (scripts/uptime_probe.py). The other is the `monitor` Railway cron service
# (railway.monitor.json).
#
# Why two: this workflow silently stops running when GitHub Actions billing
# fails — the job never starts, so the alert step never runs and nothing reports
# that monitoring itself died. That happened on 2026-07-25. A second scheduler
# on a different provider means one billing failure cannot blind us, and the
# heartbeat both of them emit feeds a dead-man's switch in python-api that
# alerts when the probes go quiet.
#
# The endpoint list lives in monitoring/endpoints.json so both schedulers check
# exactly the same things — previously each kept its own list and `webapp`
# silently went unmonitored after it was deployed as its own service.
#
# Deploy *failures* are alerted separately by /internal/railway-webhook.
# Services with no public URL are covered by `python3 scripts/status.py`.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub cron is best-effort)
  workflow_dispatch: {}

# Least privilege: this job runs a checked-out repo script with four secrets in
# env, so it should not also carry a writable GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe health endpoints
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          MONITOR_HEARTBEAT_URL: ${{ secrets.MONITOR_HEARTBEAT_URL }}
          MONITOR_HEARTBEAT_TOKEN: ${{ secrets.MONITOR_HEARTBEAT_TOKEN }}
          PROBE_SOURCE: github-actions
        # stdlib only — no pip install, no dependency on the repo's requirements.
        run: python3 scripts/uptime_probe.py --env prod
