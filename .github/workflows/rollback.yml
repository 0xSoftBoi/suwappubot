name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to roll back'
        required: true
        type: choice
        options:
          - bot
          - api-ts
          - webapp
      environment:
        description: 'Environment'
        required: true
        type: choice
        options:
          - production
          - development

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: suwappu-cluster

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    name: Rollback ${{ inputs.service }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Set service name
        id: svc
        run: |
          ENV_SUFFIX=${{ inputs.environment == 'production' && 'prod' || 'dev' }}
          echo "ecs_service=suwappu-${{ inputs.service }}-${ENV_SUFFIX}" >> $GITHUB_OUTPUT

          # Set health check URL
          case "${{ inputs.service }}" in
            bot)
              if [ "${{ inputs.environment }}" == "production" ]; then
                echo "health_url=https://bot.suwappu.bot/health" >> $GITHUB_OUTPUT
              else
                echo "health_url=https://devbot.suwappu.bot/health" >> $GITHUB_OUTPUT
              fi
              ;;
            api-ts)
              if [ "${{ inputs.environment }}" == "production" ]; then
                echo "health_url=https://api.suwappu.bot/health" >> $GITHUB_OUTPUT
              else
                echo "health_url=https://devapi.suwappu.bot/health" >> $GITHUB_OUTPUT
              fi
              ;;
            webapp)
              if [ "${{ inputs.environment }}" == "production" ]; then
                echo "health_url=https://app.suwappu.bot" >> $GITHUB_OUTPUT
              else
                echo "health_url=https://devfront.suwappu.bot" >> $GITHUB_OUTPUT
              fi
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current task definition
        id: current
        run: |
          CURRENT_TD=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ steps.svc.outputs.ecs_service }} \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "task_definition=${CURRENT_TD}" >> $GITHUB_OUTPUT

          # Extract family and revision
          TD_FAMILY=$(echo "${CURRENT_TD}" | sed 's|.*/||' | sed 's|:.*||')
          TD_REVISION=$(echo "${CURRENT_TD}" | sed 's|.*:||')
          PREV_REVISION=$((TD_REVISION - 1))

          echo "family=${TD_FAMILY}" >> $GITHUB_OUTPUT
          echo "current_revision=${TD_REVISION}" >> $GITHUB_OUTPUT
          echo "previous_revision=${PREV_REVISION}" >> $GITHUB_OUTPUT

          echo "Current: ${TD_FAMILY}:${TD_REVISION}"
          echo "Rolling back to: ${TD_FAMILY}:${PREV_REVISION}"

      - name: Verify previous revision exists
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.current.outputs.family }}:${{ steps.current.outputs.previous_revision }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text

          echo "Previous revision verified."

      - name: Roll back service
        run: |
          echo "Rolling back ${{ steps.svc.outputs.ecs_service }} to revision ${{ steps.current.outputs.previous_revision }}..."

          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ steps.svc.outputs.ecs_service }} \
            --task-definition "${{ steps.current.outputs.family }}:${{ steps.current.outputs.previous_revision }}" \
            --enable-execute-command \
            --force-new-deployment

      - name: Wait for stability
        run: |
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ steps.svc.outputs.ecs_service }}

          echo "Service stabilized."

      - name: Health check
        run: |
          echo "Checking ${{ steps.svc.outputs.health_url }}..."
          sleep 10
          curl -sf "${{ steps.svc.outputs.health_url }}" || echo "Health check pending (service may still be starting)"

      - name: Rollback summary
        run: |
          echo "## Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ steps.svc.outputs.ecs_service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rolled back from | ${{ steps.current.outputs.family }}:${{ steps.current.outputs.current_revision }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rolled back to | ${{ steps.current.outputs.family }}:${{ steps.current.outputs.previous_revision }} |" >> $GITHUB_STEP_SUMMARY
