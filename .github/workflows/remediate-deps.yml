name: Temporary dependency lock remediation

on:
  push:
    branches:
      - agent/blocking-dependency-security-gate
    paths:
      - .github/workflows/remediate-deps.yml

permissions:
  contents: write

jobs:
  refresh-bun-locks:
    if: github.repository == '0xSoftBoi/suwappubot' && github.ref == 'refs/heads/agent/blocking-dependency-security-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Regenerate Python and npm locks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-tools==7.6.0 pip-audit==2.10.1
          pip-compile --no-strip-extras --output-file=requirements.txt requirements.in
          (cd webapp && npm install --package-lock-only --ignore-scripts)

      - name: Refresh compatible Bun dependency locks
        shell: bash
        run: |
          set -euo pipefail
          for dir in api-ts terminal showcase extension packages/mcp-server; do
            echo "::group::bun update ($dir)"
            (cd "$dir" && bun update --lockfile-only --ignore-scripts)
            echo "::endgroup::"
          done

      - name: Prove regenerated dependency locks are clear
        shell: bash
        run: |
          set -euo pipefail
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325
          (cd webapp && npm audit --audit-level=high)
          for dir in api-ts terminal showcase extension packages/sdk packages/mcp-server packages/openclaw packages/design-tokens; do
            echo "::group::bun audit ($dir)"
            (cd "$dir" && bun audit --audit-level=high)
            echo "::endgroup::"
          done

      - name: Commit generated lockfiles
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          unexpected="$(git diff --name-only | grep -Ev '^(requirements\.txt|webapp/package-lock\.json|api-ts/bun\.lock|terminal/bun\.lock|showcase/bun\.lock|extension/bun\.lock|packages/mcp-server/bun\.lock)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Generator changed unexpected files:"
            echo "$unexpected"
            exit 1
          fi
          git add requirements.txt webapp/package-lock.json api-ts/bun.lock terminal/bun.lock showcase/bun.lock extension/bun.lock packages/mcp-server/bun.lock
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh audited Bun locks [deps-remediated]"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push generated lockfiles
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "HEAD:$GITHUB_REF_NAME"
