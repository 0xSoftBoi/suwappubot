# SDK publish workflow — converted to npm Trusted Publishing (OIDC) 2026-08.
#
# MANUAL STEP REQUIRED (one-time, per package, npm maintainer only):
# On npmjs.com, for each of @suwappu/sdk, @suwappu/openclaw, and
# @suwappu/mcp-server, go to Package Settings -> Trusted Publisher and add
# GitHub Actions as a trusted publisher with:
#   Repository:        0xSoftBoi/suwappubot
#   Workflow filename:  publish-sdk.yml
#   Environment:        (leave blank unless a GitHub Environment is added)
# Without this, `npm publish` in the publish-ts job will fail auth even
# though NPM_TOKEN has been removed — the CI side (id-token: write +
# npm >= 11.5.1 + no auth token configured) only works once npm's registry
# has this trust relationship configured on their end.
name: Publish SDKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which SDKs to publish'
        required: true
        default: 'all'
        type: choice
        options: [all, ts, python]

jobs:
  publish-ts:
    if: github.event_name == 'push' || contains(fromJSON('["all","ts"]'), inputs.targets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 20's bundled
      # npm predates that, so upgrade the CLI before any publish step. No
      # NODE_AUTH_TOKEN is set anywhere in this job — auth comes solely from
      # the id-token: write permission above plus the trusted-publisher link
      # configured on npmjs.com (see file header comment).
      - name: Upgrade npm for trusted publishing support
        run: npm install -g npm@latest

      - name: Run shared TypeScript package release contract
        run: bash scripts/verify-ts-packages.sh

      # Publishes are version-guarded so a re-run (or a tag covering an
      # already-published package) is a no-op instead of a hard failure.
      - name: Publish @suwappu/sdk
        run: |
          cd packages/sdk
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/sdk@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi

      - name: Publish @suwappu/openclaw
        run: |
          cd packages/openclaw
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/openclaw@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/openclaw@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi

      - name: Publish @suwappu/mcp-server
        run: |
          cd packages/mcp-server
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/mcp-server@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi

  publish-python:
    if: github.event_name == 'push' || contains(fromJSON('["all","python"]'), inputs.targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install build twine './packages/sdk-python[dev]'
      - name: Test Python SDK
        run: python -m pytest packages/sdk-python/tests -q
      - name: Build sdist + wheel
        run: cd packages/sdk-python && python -m build
      - name: Clean-install built wheel
        run: |
          python -m venv "$RUNNER_TEMP/python-publish-consumer"
          "$RUNNER_TEMP/python-publish-consumer/bin/pip" install packages/sdk-python/dist/*.whl
          "$RUNNER_TEMP/python-publish-consumer/bin/python" -I -c "from suwappu import create_client; assert callable(create_client)"
      - name: Check metadata
        run: cd packages/sdk-python && twine check dist/*
      - name: Publish to PyPI
        run: cd packages/sdk-python && twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
