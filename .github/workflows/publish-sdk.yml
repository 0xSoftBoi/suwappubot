name: Publish SDKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which SDKs to publish'
        required: true
        default: 'all'
        type: choice
        options: [all, ts, python]

jobs:
  publish-ts:
    if: github.event_name == 'push' || contains(fromJSON('["all","ts"]'), inputs.targets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build @suwappu/sdk
        run: cd packages/sdk && bun install && bun run build

      # Was `|| true` — a broken openclaw build silently published a stale dist.
      - name: Build @suwappu/openclaw
        run: cd packages/openclaw && bun install && bun run build

      - name: Build @suwappu/mcp-server
        run: cd packages/mcp-server && bun install && bun run build

      # The bundled binary must actually start. A duplicated shebang once made
      # dist/index.js a SyntaxError, which no build step would have caught.
      - name: Smoke-test mcp-server binary
        run: |
          cd packages/mcp-server
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | SUWAPPU_API_KEY=ci_dummy timeout 30 node dist/index.js > /tmp/mcp-out.json
          grep -q '"serverInfo"' /tmp/mcp-out.json
          grep -q '"tools"' /tmp/mcp-out.json
          echo "mcp-server responds to initialize + tools/list"

      # Publishes are version-guarded so a re-run (or a tag covering an
      # already-published package) is a no-op instead of a hard failure.
      - name: Publish @suwappu/sdk
        run: |
          cd packages/sdk
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/sdk@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @suwappu/openclaw
        run: |
          cd packages/openclaw
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/openclaw@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/openclaw@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @suwappu/mcp-server
        run: |
          cd packages/mcp-server
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/mcp-server@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    if: github.event_name == 'push' || contains(fromJSON('["all","python"]'), inputs.targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install build twine
      - name: Build sdist + wheel
        run: cd packages/sdk-python && python -m build
      - name: Check metadata
        run: cd packages/sdk-python && twine check dist/*
      - name: Publish to PyPI
        run: cd packages/sdk-python && twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
