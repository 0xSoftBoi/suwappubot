name: Publish SDKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which SDKs to publish'
        required: true
        default: 'all'
        type: choice
        options: [all, ts, python]

jobs:
  publish-ts:
    if: github.event_name == 'push' || contains(fromJSON('["all","ts"]'), inputs.targets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build @suwappu/sdk
        run: |
          cd packages/sdk
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
          npm pack --dry-run

      # Was `|| true` — a broken openclaw build silently published a stale dist.
      - name: Build @suwappu/openclaw
        run: |
          cd packages/openclaw
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
          npm pack --dry-run

      - name: Build @suwappu/mcp-server
        run: |
          cd packages/mcp-server
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
          npm pack --dry-run

      # The binary must start AND actually proxy. Runs against a local mock,
      # so a network blip cannot fail a publish.
      - name: Smoke-test mcp-server proxy
        run: cd packages/mcp-server && node scripts/smoke.mjs

      # Publishes are version-guarded so a re-run (or a tag covering an
      # already-published package) is a no-op instead of a hard failure.
      - name: Publish @suwappu/sdk
        run: |
          cd packages/sdk
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/sdk@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @suwappu/openclaw
        run: |
          cd packages/openclaw
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/openclaw@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/openclaw@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @suwappu/mcp-server
        run: |
          cd packages/mcp-server
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@suwappu/mcp-server@$VERSION" version >/dev/null 2>&1; then
            echo "@suwappu/mcp-server@$VERSION already published — skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-python:
    if: github.event_name == 'push' || contains(fromJSON('["all","python"]'), inputs.targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install build twine './packages/sdk-python[dev]'
      - name: Test Python SDK
        run: python -m pytest packages/sdk-python/tests -q
      - name: Build sdist + wheel
        run: cd packages/sdk-python && python -m build
      - name: Check metadata
        run: cd packages/sdk-python && twine check dist/*
      - name: Publish to PyPI
        run: cd packages/sdk-python && twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
