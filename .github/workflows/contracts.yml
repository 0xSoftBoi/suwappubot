name: Solidity Contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "contracts/primitives/**"
      - "contracts/test/MixYieldVault*.t.sol"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/primitives/**"
      - "contracts/test/MixYieldVault*.t.sol"
      - ".github/workflows/contracts.yml"

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundry:
    name: Primitive build, tests & invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_SRC: primitives
      FOUNDRY_SCRIPT: __no_scripts__
      FOUNDRY_REMAPPINGS: |
        forge-std/=lib/forge-std/src/
        @openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install test dependency
        run: forge install foundry-rs/forge-std --no-git

      - name: Forge version
        run: forge --version

      - name: Compile primitive library
        run: forge build --sizes --skip test

      - name: Mixed-yield unit and fuzz tests
        run: forge test --match-path 'test/MixYieldVaultTest.t.sol' -vvv

      - name: Mixed-yield invariant stress run
        env:
          FOUNDRY_INVARIANT_RUNS: "512"
          FOUNDRY_INVARIANT_DEPTH: "64"
        run: forge test --match-path 'test/MixYieldVaultInvariant.t.sol' -vv
