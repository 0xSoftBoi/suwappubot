name: Solidity Contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "contracts/primitives/**"
      - "contracts/test/MixYieldVault*.t.sol"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/primitives/**"
      - "contracts/test/MixYieldVault*.t.sol"
      - ".github/workflows/contracts.yml"

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundry:
    name: Primitive build, tests & invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    env:
      # The repository's src="." also includes historical deploy scripts that do
      # not currently parse under solc 0.8.27. Keep this security gate scoped to
      # the primitive library being changed; the full-tree cleanup is separate.
      FOUNDRY_SRC: primitives
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Forge version
        run: forge --version

      - name: Compile primitive library
        run: forge build --sizes

      - name: Mixed-yield unit and fuzz tests
        run: forge test --match-path 'test/MixYieldVaultTest.t.sol' -vvv

      - name: Mixed-yield invariant stress run
        env:
          FOUNDRY_INVARIANT_RUNS: "512"
          FOUNDRY_INVARIANT_DEPTH: "64"
        run: forge test --match-path 'test/MixYieldVaultInvariant.t.sol' -vv
