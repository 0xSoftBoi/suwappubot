name: Solidity Contracts

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "contracts/primitives/**"
      - "contracts/test/MixYield*.t.sol"
      - ".github/workflows/contracts.yml"
  push:
    branches: [main, dev]
    paths:
      - "contracts/primitives/**"
      - "contracts/test/MixYield*.t.sol"
      - ".github/workflows/contracts.yml"

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundry:
    name: Primitive build, tests & invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_SRC: primitives
      FOUNDRY_SCRIPT: __no_scripts__
      FOUNDRY_REMAPPINGS: |
        forge-std/=lib/forge-std/src/
        @openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/
      ETHEREUM_RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install test dependency
        run: forge install foundry-rs/forge-std --no-git

      - name: Forge version
        run: forge --version

      - name: Compile primitive library
        run: forge build --sizes --skip test

      - name: Mixed-yield unit, adapter and adversarial tests
        run: forge test --match-path 'test/MixYield*Test.t.sol' --no-match-path 'test/MixYieldMainnetFork.t.sol' -vvv

      - name: Fork - Aave V3 USDC round trip
        run: forge test --match-path 'test/MixYieldMainnetFork.t.sol' --match-test 'testFork_AaveV3SupplyWithdrawRoundTrip' --fork-url "$ETHEREUM_RPC_URL" -vvv

      - name: Fork - Morpho USDC round trip
        run: forge test --match-path 'test/MixYieldMainnetFork.t.sol' --match-test 'testFork_MorphoERC4626DepositWithdrawRoundTrip' --fork-url "$ETHEREUM_RPC_URL" -vvv

      - name: Fork - protocol liquidity bound
        run: forge test --match-path 'test/MixYieldMainnetFork.t.sol' --match-test 'testFork_ProtocolLiquidityBoundsPortfolioWithdrawals' --fork-url "$ETHEREUM_RPC_URL" -vvv

      - name: Mixed-yield invariant stress run
        env:
          FOUNDRY_INVARIANT_RUNS: "512"
          FOUNDRY_INVARIANT_DEPTH: "64"
        run: forge test --match-path 'test/MixYieldVaultInvariant.t.sol' -vv
