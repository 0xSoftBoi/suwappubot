name: Setup SSH Key for EC2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Recreate key pair
        run: |
          # Delete old key pair
          aws ec2 delete-key-pair --key-name suwappu-bot-key 2>/dev/null || true

          # Create new one
          aws ec2 create-key-pair \
            --key-name suwappu-bot-key \
            --key-type ed25519 \
            --query 'KeyMaterial' \
            --output text > /tmp/key.pem

          chmod 600 /tmp/key.pem
          echo "Key pair created"

          # Get public key
          PUB_KEY=$(ssh-keygen -y -f /tmp/key.pem)
          echo "Public key: $PUB_KEY"

          # Push to instance via user-data replacement won't work
          # Instead, use SSM send-command
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=suwappu-bot" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          echo "Instance: $INSTANCE_ID"

          # Try SSM
          echo "Trying SSM send-command..."
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"mkdir -p /home/ubuntu/.ssh\",\"echo '$PUB_KEY' > /home/ubuntu/.ssh/authorized_keys\",\"chown -R ubuntu:ubuntu /home/ubuntu/.ssh\",\"chmod 700 /home/ubuntu/.ssh\",\"chmod 600 /home/ubuntu/.ssh/authorized_keys\"]" \
            --comment "Update SSH authorized_keys" \
            --output text 2>&1 && echo "SSM command sent" || echo "SSM failed - will try direct approach"

          # Wait for SSM command
          sleep 10

          # Test SSH
          echo "Testing SSH..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            -i /tmp/key.pem ubuntu@${{ secrets.EC2_HOST_PROD }} "echo SSH_SUCCESS; uptime" 2>&1 || echo "SSH not ready yet"

      - name: Save key to GitHub secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try setting secret - may fail due to GITHUB_TOKEN permissions
          gh secret set EC2_SSH_KEY < /tmp/key.pem 2>&1 || true
          echo "If secret set failed, key is printed below (base64 encoded)."
          echo "Decode with: echo '<base64>' | base64 -d"
          echo "=== BASE64 KEY START ==="
          base64 /tmp/key.pem
          echo "=== BASE64 KEY END ==="
          rm -f /tmp/key.pem
