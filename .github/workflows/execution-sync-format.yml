name: Execution Sync Format

on:
  push:
    branches:
      - feat/execution-sync-shadow
    paths:
      - 'bot/services/execution_sync*.py'
      - '.github/workflows/execution-sync-format.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/execution-sync-shadow
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install black==26.5.1
      - name: Format execution-sync modules
        run: black --line-length=100 bot/services/execution_sync*.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot/services/execution_sync*.py
          git commit -m 'style: format execution sync modules'
          git push origin HEAD:feat/execution-sync-shadow
