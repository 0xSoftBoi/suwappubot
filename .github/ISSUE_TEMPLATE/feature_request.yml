name: Feature request
description: Propose a new capability or an improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Trading / swaps / routing
        - Chain or provider support
        - Agent surface (REST / MCP / A2A / SDK)
        - Telegram, WhatsApp or Discord
        - Webapp / terminal / mobile
        - Security, wallets or key management
        - Points, referrals, subscriptions
        - Docs / developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today? Describe the use case, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'm willing to open a PR for this
