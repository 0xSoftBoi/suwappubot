startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - SUWAPPU_API_KEY
    properties:
      SUWAPPU_API_KEY:
        type: string
        description: "Your Suwappu API key (get one at POST https://api.suwappu.bot/v1/agent/register)"
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@suwappu/mcp-server'],
      env: {
        SUWAPPU_API_KEY: config.SUWAPPU_API_KEY
      }
    })
