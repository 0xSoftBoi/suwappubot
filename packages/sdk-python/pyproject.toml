[project]
name = "suwappu"
version = "0.1.0"
description = "Cross-chain DEX SDK — swaps, perps, predictions, and lending for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
suwappu = "suwappu.cli:main"

[project.urls]
Homepage = "https://suwappu.bot"
Repository = "https://github.com/0xSoftBoi/suwappubot"
Documentation = "https://docs.suwappu.bot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suwappu"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
