  --accent:#ffb45b; --accent-ink:#2a1700; --accent-soft:#3a2914; --nav:#0f0c0a; --nav-fg:#efe6db; --nav-muted:#8f8276;
  --good:#5ccf98; --good-soft:#163427; --warn:#f2b45a; --warn-soft:#382912; --bad:#f08a80; --bad-soft:#3a1c19; --info:#9db2f2; --info-soft:#1d2540; color-scheme:dark}
*{box-sizing:border-box}

/* settlement layers: L0 internal ledger (0 gas), L1 one Merkle commitment per payroll, L2 lazy claims, L3 batched push, L5 fiat */
function settle(){const P=allEmps(),C=S.invoices.filter(inEnt);const lay={l0:0,l2:0,l3:0,fiat:0};
 P.forEach(p=>{const w=p.way||'';if(/Suwappu/.test(w))lay.l0++;else if(/USDC/.test(w))lay.l2++;else lay.fiat++});
 C.forEach(c=>{/USDC/.test(c.payout)?lay.l3++:lay.fiat++});
 const n=P.length+C.length, gas={commit:52000,push:21000+lay.l3*30000}, gwei=0.012, eth=3200;
 const net=((gas.commit+gas.push)*gwei*1e-9*eth)+0.02; // + L1 data fee estimate
 return {lay,n,net,ach:lay.fiat*0.25+(n-lay.fiat)*5,perAch:5}}

  $$('[data-dm]',d).forEach(b=>b.onclick=()=>$$('[data-dm]',d).forEach(x=>x.setAttribute('aria-pressed',x===b)));$('#build',d).onclick=()=>{close();toast('Report draft ready: choose columns and filters')}})}

const ACT={
 run:()=>{S.step='grid';go('run')},approvals:()=>{S.apTab='pending';go('approvals')},taxes:()=>go('taxes'),billing:()=>go('billing'),
 bell:()=>bell('tasks'),bellact:()=>bell('activity'),remind:()=>toast('Reminder sent to Lena Park'),
 toreview:()=>{S.step='review';render();window.scrollTo(0,0)},togrid:()=>{S.step='grid';render()},toreviewro:()=>{S.step='review';go('run')},
 skip:()=>toast('Skip payroll: nobody is paid this period. Salaried pay is not carried over.'),
 submit:()=>drawer(`<h2>Submit payroll</h2><p class="muted" style="margin:0">${money(totals().debit)} · ${S.speed} pay</p><button class="btn btn-primary" id="pk">Confirm with passkey</button><button class="btn btn-ghost" data-x>Cancel</button>`,d=>{$('#pk',d).onclick=()=>{cyc('R-1128').status='Awaiting funding';S.step='done';close();render()}}),
 reqapproval:()=>{cyc('R-1128').status='Awaiting approval';S.activity.unshift('Kenji Mori requested approval for Regular payroll · just now');toast('Approval requested. Payroll is locked.');S.apTab='pending';go('approvals')},
 approve:()=>drawer(`<h2>Approve payroll</h2><p class="muted" style="margin:0">Final approval releases ${money(totals().debit)} on the debit date.</p><button class="btn btn-primary" id="pk">Approve with passkey</button><button class="btn btn-ghost" data-x>Cancel</button>`,d=>{$('#pk',d).onclick=()=>{cyc('R-1128').status='Awaiting funding';S.requests.unshift(['Today','Regular payroll · Nov 28','Approved by Kenji Mori']);close();toast('Approved');S.step='done';render()}}),
 decline:()=>{cyc('R-1128').status='Changes requested';S.requests.unshift(['Today','Regular payroll · Nov 28','Declined: sent back to Kenji Mori']);toast('Declined. The requester gets a task to update payroll.');render()},
 reportissues:()=>drawer(`<h2>Report payroll issues</h2><label class="small" for="iss">Issue<input class="field" id="iss" style="width:100%" value="Check Jo Alvarez double overtime"></label><button class="btn btn-quiet" data-act="noop">Add issue</button><button class="btn btn-primary" id="subiss">Submit issues</button><button class="btn btn-ghost" data-x>Cancel</button>`,d=>{$('#subiss',d).onclick=()=>{cyc('R-1128').status='Changes requested';S.requests.unshift(['Today','Regular payroll · Nov 28','Issues reported: "'+$('#iss',d).value+'"']);close();toast('Issues sent. Payroll unlocked for edits.');render()}}),
 cancel:()=>{cyc('R-1128').status='Not started';S.step='grid';toast('Payroll cancelled. Nothing was debited; entries kept.');render()},
 payfunding:()=>{cyc('R-1128').status='Processing funding';toast('Funding sent from your Payday account');render()},
 fund:()=>drawer(`<h2>Add money</h2><label class="small" for="amt">Amount<input class="field" id="amt" value="10000" style="width:100%"></label><button class="btn btn-primary" id="addm">Add from Chase ••4410</button><button class="btn btn-ghost" data-x>Cancel</button>`,d=>{$('#addm',d).onclick=()=>{const v=parseFloat($('#amt',d).value.replace(/[$,]/g,''));if(v>0){S.balance+=v;close();toast(money(v)+' added');render()}}}),
 paysel:payFlow,clearsel:()=>{S.selected.clear();render()},newpolicy:policyWizard,builder,
 calendar:()=>drawer(`<h2>Payroll calendar · Nov 28 payday</h2><div class="timeline">${[['Start date','Mon, Nov 10',1],['Timesheet cut off','Sun, Nov 23',1],['Payroll deadline (2-day)','Mon, Nov 24 · 4:00 pm PT',0],['Payroll approval','Mon, Nov 24 · 4:00 pm PT',0],['Debit','Wed, Nov 26',0],['Payday','Fri, Nov 28',0]].map(([a,b,d],i,arr)=>`<div class="tl ${d?'done':(!d&&arr[i-1]&&arr[i-1][2])?'now':''}"><i></i><span>${a}</span><span class="small muted">${b}</span></div>`).join('')}</div><button class="btn btn-ghost" data-act="noop">Edit payroll calendar</button><button class="btn btn-primary" data-x>Close</button>`),
 actlog:()=>drawer(`<h2>Activity log</h2>${S.activity.map(a=>`<div class="todo small">${esc(a)}</div>`).join('')}<button class="btn btn-primary" data-x>Close</button>`),
 addperson:()=>drawer(`<h2>Add team member</h2><label class="small" for="nm">Name<input class="field" id="nm" style="width:100%"></label><label class="small" for="ty">Type<select class="field" id="ty" style="width:100%"><option>Employee (W-2)</option><option>Contractor (US)</option><option>Contractor (international)</option></select></label><label class="small" for="ct">Email, phone or Telegram<input class="field" id="ct" style="width:100%"></label><div class="alert info">They'll get a link to add tax forms and a payment method.</div><button class="btn btn-primary" id="addp">Send invite</button><button class="btn btn-ghost" data-x>Cancel</button>`,d=>{$('#addp',d).onclick=()=>{const n=$('#nm',d).value.trim();if(!n){toast('Add a name');return}close();toast('Invite sent to '+n)}}),
 sendhome:()=>drawer(`<h2>Send money home</h2><label class="small" for="sa">Amount (USD)<input class="field" id="sa" value="200" style="width:100%"></label>
  <label class="small" for="sto">To<select class="field" id="sto" style="width:100%"><option>Mamá · Oaxaca, Mexico · cash pickup</option><option>Mamá · Oaxaca, Mexico · bank (SPEI)</option><option>Tito · Manila, Philippines · GCash</option></select></label>
  <div class="kv"><span>Exchange rate</span><span>Mid-market, locked 60 s</span></div><div class="kv"><span>Network cost</span><span>$0.01 · covered</span></div><div class="kv"><span>Cash-out partner fee</span><span>Shown before you confirm</span></div><div class="kv"><span>Arrives</span><span>Minutes</span></div>
  <button class="btn btn-primary" id="sendh">Send</button><button class="btn btn-ghost" data-x>Cancel</button>`,d=>{$('#sendh',d).onclick=()=>{close();toast('Sent. Pickup code texted to Mamá.')}}),
 withdraw:()=>{const el=$('#earned');const v=el?parseFloat(el.dataset.base):0;S.withdrawn=(S.withdrawn||0)+v;toast(money(v,2)+' sent to your account · arrives in seconds');render()},
 proof:()=>drawer(`<h2>Proof of income</h2><p class="muted" style="margin:0">A link a landlord or lender can open to confirm your pay. It shows only what you choose.</p>
  ${[['Employer','Ramen Bar SF LLC',1],['Average monthly take-home (6 months)','$6,412',1],['Employed since','March 2024',1],['Exact paychecks','Hidden',0]].map(([a,b,on],i)=>`<label class="kv"><span><input type="checkbox" class="chk" ${on?'checked':''}> ${a}</span><span>${b}</span></label>`).join('')}
  <div class="kv"><span>Link expires</span><span>in 30 days</span></div><button class="btn btn-primary" data-act="noop">Create link</button><button class="btn btn-ghost" data-x>Cancel</button>
  <div class="small muted">Backed by the public payment receipts, so it can't be faked with an edited PDF.</div>`),
 receipt:()=>drawer(`<h2>Payment receipt</h2><div class="kv"><span>Network</span><span>Base</span></div><div class="kv"><span>Confirmed</span><span>Nov 14, 9:00:04 am PT</span></div><div class="kv"><span>Payments</span><span>6 in one batch</span></div><div class="kv"><span>Network fee</span><span>$0.03 · covered by Payday</span></div><div class="kv"><span>Matches payroll</span><span>${pill('Verified','good')}</span></div><div class="small muted">Names and individual amounts aren't public. Your accountant gets a key to match each line.</div><button class="btn btn-primary" data-x>Close</button>`),
 newrule:()=>drawer(`<h2>New payout rule</h2><label class="small" for="rn">Name<input class="field" id="rn" style="width:100%" placeholder="e.g. Weekend shift bonus"></label>
  <label class="small" for="rt">When<select class="field" id="rt" style="width:100%"><option>A sale or tip comes in (Toast, Square, Shopify)</option><option>A Stripe invoice is paid</option><option>Timesheets are approved</option><option>On a schedule</option><option>An API call (your app or an AI agent)</option></select></label>
  <label class="small" for="rs">Pay<select class="field" id="rs" style="width:100%"><option>A percentage, split by hours worked</option><option>A percentage to one person</option><option>A fixed amount</option></select></label>
  <label class="small" for="rc">Limit per payout<input class="field" id="rc" style="width:100%" value="$500"></label>
  <button class="btn btn-primary" id="mkrule">Create rule</button><button class="btn btn-ghost" data-x>Cancel</button>`,d=>{$('#mkrule',d).onclick=()=>{const n=$('#rn',d).value.trim()||'New rule';S.rules.push({name:n,trigger:$('#rt',d).value,split:$('#rs',d).value,cap:$('#rc',d).value,on:true,last:'Never run'});close();toast('Rule created');render()}}),
 runreport:()=>toast('Report ready: PDF, CSV or Excel'),noop:()=>toast('Not in this prototype')
};

document.addEventListener('click',e=>{const T=e.target;
 const g=T.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=T.closest('[data-act]');if(a){(ACT[a.dataset.act]||ACT.noop)();return}
 const q=(sel,fn)=>{const el=T.closest(sel);if(el){fn(el);return true}};
 if(q('[data-gtab]',el=>{S.gridTab=el.dataset.gtab;render()}))return;
 if(q('[data-ctab]',el=>{S.cycleTab=el.dataset.ctab;render()}))return;
 if(q('[data-atab]',el=>{S.apTab=el.dataset.atab;render()}))return;
 if(q('[data-stab]',el=>{S.setTab=el.dataset.stab;render()}))return;
 if(q('[data-btab]',el=>bell(el.dataset.btab)))return;
 if(q('[data-speed]',el=>{S.speed=el.dataset.speed;render()}))return;
 if(q('[data-dismiss]',el=>{S.dismissed.add(el.dataset.dismiss);render()}))return;
 if(q('[data-pers]',el=>{S.persona=el.dataset.pers;render()}))return;
 if(q('[data-rule]',el=>{const r=S.rules[+el.dataset.rule];r.on=!r.on;render()}))return;
 if(q('[data-pol]',el=>{const p=S.policies[+el.dataset.pol];p.on=!p.on;render()}))return;
 if(q('[data-approveinv]',el=>{const i=S.invoices.find(x=>x.id===+el.dataset.approveinv);i.status='Approved';toast(i.who+' invoice approved');render()}))return;
 if(q('[data-stub]',el=>{const p=S.people.find(x=>x.id===+el.dataset.stub);drawer(`<h2>${esc(p.name)} · Nov 28</h2>${stub(p)}<button class="btn btn-primary" data-x>Close</button>`)}))return;
 if(q('[data-way]',el=>{const p=S.people.find(x=>x.id===(S.seeAs||1));p.way=el.dataset.way;render();toast('Saved. Starts after the 48-hour hold.')}))return;
 if(q('[data-person]',el=>{const p=S.people.find(x=>x.id===+el.dataset.person);let tab='personal';const draw=()=>drawer(`<div class="who">${av(p)}<div><h2>${esc(p.name)}</h2><small>${esc(p.title)} · ${ENT[p.ent]}</small></div></div>
   <div class="tabs">${[['personal','Personal information'],['work','Work & pay'],['payroll','Payroll'],['docs','Documents']].map(([k,l])=>`<button class="tab" data-pt="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div>
   <div class="card">${tab==='personal'?`<div class="kv"><span>Contact</span><span>On file (masked)</span></div><div class="kv"><span>Home address</span><span>${p.ent==='sf'?'San Francisco, CA':'Brooklyn, NY'}</span></div>`:tab==='work'?`<div class="kv"><span>Job</span><span>${esc(p.title)}</span></div><div class="kv"><span>Compensation</span><span>${p.pay==='salary'?money(p.salary)+' / year':money(p.rate,2)+' / hour'}</span></div><div class="kv"><span>Pay schedule</span><span>Every other Friday</span></div>`:tab==='payroll'?`<div class="kv"><span>Paystubs</span><span>${p.last[0]?'6':'0'}</span></div><div class="kv"><span>Withholding (W-4)</span><span>${p.w4}</span></div><div class="kv"><span>Payment method</span><span>${p.way?esc(p.way):'Missing'}</span></div>`:`<div class="kv"><span>Offer letter</span><span>Signed</span></div><div class="kv"><span>I-9</span><span>${p.last[0]?'Verified':'Pending'}</span></div>`}</div>
   ${cite('Rippling employee detail: Personal information / Documents / Payroll (Paystubs, Withholding, Settings) · Gusto Work tab')}<button class="btn btn-ghost" data-x>Close</button>`,d=>$$('[data-pt]',d).forEach(b=>b.onclick=()=>{tab=b.dataset.pt;draw()}));draw()}))return;
 if(T.closest('#types')){const m=$('#typemenu');m.innerHTML=m.innerHTML?'':`<div class="menu">${[['Off-cycle','Extra pay outside the schedule'],['Extra pay (bonus)','Supplemental tax rate, no regular deductions'],['Correction','Fix a past paycheck'],['Termination / dismissal','Final pay under state rules'],['Contractor payment','One-off payment to a contractor']].map(([x,y])=>`<button data-act="noop"><b>${x}</b><small>${y}</small></button>`).join('')}</div>`;return}
 if(T.closest('#colsbtn')){const m=$('#colsmenu');m.innerHTML=m.innerHTML?'':`<div class="menu">${[['bonus','Bonus'],['commission','Commission'],['dot','Double overtime'],['reimb','Reimbursement'],['note','Personal note']].map(([k,l])=>`<label style="display:flex;gap:8px;padding:8px 10px"><input type="checkbox" class="chk" data-col="${k}" ${S.cols[k]?'checked':''}>${l}</label>`).join('')}</div>`;return}
 if(T.closest('#bell')){$('#bellpop').innerHTML?$('#bellpop').innerHTML='':bell('tasks');return}
 if(!T.closest('.pop')&&!T.closest('.menu')){$('#bellpop').innerHTML='';['#typemenu','#colsmenu'].forEach(s=>{const m=$(s);if(m)m.innerHTML=''})}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.p){const p=S.people.find(x=>x.id===+t.dataset.p);if(t.dataset.k==='note'){p.note=t.value;return}const v=parseFloat(t.value);if(!isNaN(v)&&v>=0){p[t.dataset.k]=v;const pos=t.selectionStart;render();const n=$(`[data-p="${t.dataset.p}"][data-k="${t.dataset.k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}}
 if(t.id==='var'){const v=parseFloat(t.value);if(v>0)S.variance=v}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='ent'){S.entity=t.value;render()} if(t.id==='mnav')go(t.value); if(t.id==='grp'){S.grp=t.value;render()} if(t.id==='cmp'){S.compare=t.value;render()}
 if(t.id==='auto'){S.autopilot=t.checked;toast(S.autopilot?'AutoPilot on':'AutoPilot off')} if(t.id==='seeas'){S.seeAs=+t.value;render()}
 if(t.dataset.sel){const id=+t.dataset.sel;t.checked?S.selected.add(id):S.selected.delete(id);render()}
 if(t.dataset.col){S.cols[t.dataset.col]=t.checked;render()}
 if(t.id==='float'){S.float=t.checked;toast(S.float?'Float will earn until payday':'Float stays in cash')}
 if(t.dataset.stream){S.streaming[t.dataset.stream]=t.checked;toast('Streaming pay '+(t.checked?'on':'off')+' for '+t.dataset.stream+' staff')}});
setInterval(()=>{const el=document.getElementById('earned');if(!el)return;const b=parseFloat(el.dataset.base),r=parseFloat(el.dataset.rate);el.dataset.base=b+r;el.textContent=money(b+r,2)},1000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();$('#bellpop').innerHTML=''}});
const h=(location.hash||'').slice(1);if(V[h])S.view=h;render();
})();
</script>
