<style>

  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14110e; --surface:#1e1914; --sunk:#29221c; --fg:#f5eee6; --muted:#b1a395; --line:#372e26;
  --accent:#ffb45b; --accent-ink:#2a1700; --accent-soft:#3a2914; --nav:#0f0c0a; --nav-fg:#efe6db; --nav-muted:#8f8276;
  --good:#5ccf98; --good-soft:#163427; --warn:#f2b45a; --warn-soft:#382912; --bad:#f08a80; --bad-soft:#3a1c19; --info:#9db2f2; --info-soft:#1d2540; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110e; --surface:#1e1914; --sunk:#29221c; --fg:#f5eee6; --muted:#b1a395; --line:#372e26;
  --accent:#ffb45b; --accent-ink:#2a1700; --accent-soft:#3a2914; --nav:#0f0c0a; --nav-fg:#efe6db; --nav-muted:#8f8276;
  --good:#5ccf98; --good-soft:#163427; --warn:#f2b45a; --warn-soft:#382912; --bad:#f08a80; --bad-soft:#3a1c19; --info:#9db2f2; --info-soft:#1d2540; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
aside{background:var(--nav);color:var(--nav-fg);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}

.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-plain{background:var(--sunk);color:var(--muted)}

input,select{font:inherit;color:var(--fg)}
.field{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);min-width:0}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:10px;font-size:.86rem}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.info{background:var(--info-soft);color:var(--info)} .alert.good{background:var(--good-soft);color:var(--good)}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0}
.tl i{width:12px;height:12px;border-radius:50%;margin-top:4px;border:2px solid var(--line);background:var(--surface)}
.tl.done i{background:var(--good);border-color:var(--good)} .tl.now i{background:var(--accent);border-color:var(--accent)}
.drawer-scrim{position:fixed;inset:0;background:rgba(15,10,5,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(520px,100%);height:100%;overflow:auto;padding:22px max(22px,env(safe-area-inset-right,0px)) 40px 22px;display:flex;flex-direction:column;gap:16px;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.pop{position:absolute;right:0;top:46px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px;z-index:10;display:flex;flex-direction:column;gap:8px}
.menu{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:6px;z-index:10;min-width:260px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;font:inherit;color:var(--fg);cursor:pointer}

.rel{position:relative}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:500;z-index:40;max-width:calc(100% - 32px)}
.way{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--surface);cursor:pointer;color:inherit;font:inherit;text-align:left;width:100%}
.way[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.phone{max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px}

.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}

  .mobile-nav select{flex:1;min-width:0;background:rgba(255,255,255,.08);color:var(--nav-fg);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:8px}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

}

<script>
(function(){
const ic = {
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 pay:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',

 approvals:'<path d="M9 12l2 2 4-4"/><rect x="4" y="3" width="16" height="18" rx="2"/>',
 reports:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
 taxes:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
 eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>`;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (n,d=0) => (n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const hues=['#fde3c2','#d6efe2','#dfe3fb','#fadbe2','#e3eecf','#f6e0c9','#d9ecf3'];
const av = p => `<span class="av" style="background:${hues[p.id%hues.length]}">${p.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</span>`;
const pill = (t,k)=>`<span class="pill p-${k}">${esc(t)}</span>`;
const toast = m => {const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};

/* ---------- Example data (sample company, not real people) ---------- */
const ENT = {sf:'Ramen Bar SF LLC · CA', ny:'Ramen Bar NY LLC · NY'};
const S = {

  {id:2,name:'Diego Ruiz',title:'Line cook',type:'employee',ent:'sf',pay:'hourly',rate:26,hrs:80,ot:0,bonus:0,reimb:0,last:2080,pto:8,k401:3,health:180,way:'instant',split:'100% debit card'},
  {id:3,name:'Aiko Tanaka',title:'Server',type:'employee',ent:'sf',pay:'hourly',rate:19,hrs:64,ot:0,bonus:0,reimb:0,last:1368,pto:0,k401:0,health:0,way:'app',split:'100% Suwappu balance'},
  {id:4,name:'Sam Okafor',title:'Server',type:'employee',ent:'ny',pay:'hourly',rate:21,hrs:72,ot:0,bonus:250,reimb:0,last:1512,pto:0,k401:0,health:120,way:'crypto',split:'100% USDC · Base'},

  {id:6,name:'Ravi Shah',title:'Bookkeeper',type:'employee',ent:'sf',pay:'salary',salary:72000,hrs:80,ot:0,bonus:0,reimb:0,last:2769,pto:16,k401:6,health:240,way:'bank',split:'100% Wells ••2201'},
  {id:7,name:'Jo Alvarez',title:'Dishwasher',type:'employee',ent:'ny',pay:'hourly',rate:18,hrs:80,ot:12,bonus:0,reimb:0,last:1440,pto:0,k401:0,health:0,way:'bank',split:'100% Chase ••9910'}

const inEnt = p => S.entity==='all' || p.ent===S.entity;
function gross(p){ const reg = p.pay==='salary' ? p.salary/26 : p.rate*p.hrs; const ot = p.pay==='salary'?0:p.rate*1.5*p.ot; return reg+ot+p.bonus; }
// Estimate only: in production gross-to-net comes from the tax partner.
function calc(p){ const g=gross(p); const pre=g*p.k401/100+p.health; const taxable=g-pre;
  const fed=taxable*0.11, fica=g*0.0765, state=taxable*(p.ent==='sf'?0.05:0.055), erTax=g*0.0765+Math.min(g,7000)*0.006;
  const net=g-pre-fed-fica-state+p.reimb; return {g,pre,fed,fica,state,er:erTax,net,reimb:p.reimb}; }
function variance(p){ if(!p.last) return null; return (gross(p)-p.last)/p.last*100; }
const emps = ()=>S.people.filter(inEnt);
const ctrs = ()=>S.contractors.filter(inEnt);
function totals(){ const t={g:0,pre:0,fed:0,fica:0,state:0,er:0,net:0,reimb:0};
  emps().forEach(p=>{const c=calc(p);for(const k in t)t[k]+=c[k]}); t.taxes=t.fed+t.fica+t.state+t.er; t.debit=t.net+t.taxes+t.pre; return t; }
const run = id => S.runs.find(r=>r.id===id);
function alerts(){ const a=[];
  emps().forEach(p=>{ const v=variance(p);
    if(p.way==='pending') a.push({k:'warn',t:`${p.name} hasn't chosen how to get paid. Their pay will wait safely until they do.`});
    if(!p.last) a.push({k:'info',t:`${p.name} is on their first payroll.`});
    else if(Math.abs(v)>=15) a.push({k:'warn',t:`${p.name}'s gross pay is ${v>0?'up':'down'} ${Math.abs(v).toFixed(0)}% from last payroll.`});
    if(p.ot>=10) a.push({k:'info',t:`${p.name} has ${p.ot} overtime hours.`}); });
  return a; }
function tasks(){ const t=[]; const R=run('R-1128');
  if(R.status==='Unprocessed') t.push({sev:'warn',title:'Run payroll for Nov 28',sub:'Run by Mon, Nov 24 · 4:00 pm PT for 2-day pay',act:'run',btn:'Run payroll'});

  S.people.filter(p=>p.way==='pending').forEach(p=>t.push({sev:'info',title:`${p.name} needs to set up payment`,sub:'Invite sent by text · reminder in 2 days',act:'remind',btn:'Resend'}));

  t.push({sev:'plain',title:'Approve 1 contractor invoice',sub:'Nkem Eze · $700 · due Nov 30',act:'pay',btn:'Review'});

  <div class="todo"><div class="t"><b>Automatic user provisioning (SCIM)</b><small>Add and remove admins from your identity provider</small></div>${pill('On','good')}</div>
  <div class="todo"><div class="t"><b>Passkey for approvals and payouts</b><small>Required for submit, approve and payment-detail changes</small></div>${pill('Required','good')}</div>
  <div class="todo"><div class="t"><b>Payment-detail change hold</b><small>48 hours before a new bank or wallet receives pay</small></div>${pill('48 h','good')}</div>
  <div class="todo"><div class="t"><b>Audit log</b><small>Every admin action, exportable</small></div><button class="btn btn-quiet" data-go="reports">View</button></div></div>`,
 api:`<div class="card" style="padding:0;border:0"><div class="todo"><div class="t"><b>API keys</b><small>2 active · last used 3 hours ago</small></div><button class="btn btn-quiet" data-act="noop">Manage</button></div>
  <div class="todo"><div class="t"><b>Webhooks</b><small>payroll.submitted, payroll.paid, payment.failed, person.payment_method_changed · signed</small></div>${pill('3 endpoints','good')}</div>
  <div class="todo"><div class="t"><b>AI agents</b><small>Let an assistant prepare payrolls and pay prizes within your approval rules</small></div>${pill('Off','plain')}</div></div>`};
 return `<div class="head"><div><h1>Settings</h1><p>Company, access and connections.</p></div></div>
  <div class="tabs" role="tablist">${[['entities','Entities'],['roles','Roles & permissions'],['schedules','Pay schedules'],['integrations','Integrations'],['security','Security'],['api','API & webhooks']].map(([k,l])=>`<button class="tab" role="tab" data-stab="${k}" aria-selected="${tab===k}">${l}</button>`).join('')}</div>
  <div class="card">${T[tab]}</div>`;
};

const WAYS=[['bank','Bank account','1–2 business days','Free'],['instant','Debit card','Within minutes','1%'],['app','Keep in Suwappu','Instant · can earn interest','Free'],['wise','Wise / Revolut','Up to 1 business day','Free'],['paypal','PayPal','Up to 1 day','2%'],['crypto','Crypto wallet','Instant · USDC or another coin, any network · we cover network fees','Free']];
V.them=()=>{ const p=S.people.find(x=>x.id===(S.seeAs||1)); const c=calc(p);
 return `<div class="head"><div><h1>What payees see</h1><p>No app to download. They get a text, email or Telegram message with a link.</p></div>
  <label class="small" for="seeas">Preview as <select class="field" id="seeas">${S.people.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>
 <div class="grid2"><div class="phone">
   <div class="muted small">Ramen Bar SF · Payday</div>
   <div><div class="muted small">You get paid Fri, Nov 28</div><div style="font:800 2.2rem var(--display)" class="num">${money(c.net,2)}</div><div class="small muted">from ${money(c.g,2)} before taxes and deductions</div></div>
   <h3>How do you want to get paid?</h3>
   ${WAYS.map(w=>`<button class="way" data-way="${w[0]}" aria-pressed="${p.way===w[0]}"><span class="m"><b>${w[1]}</b><small>${w[2]}</small></span>${pill(w[3],w[3]==='Free'?'good':'plain')}</button>`).join('')}
   <div class="small muted">You can split it, like 80% to your bank and 20% to savings.</div></div>
  <div class="card"><h2>Pay stub · Nov 28</h2>
   <div class="kv"><span>Gross pay</span><span class="num">${money(c.g,2)}</span></div><div class="kv"><span>Federal income tax</span><span class="num">−${money(c.fed,2)}</span></div><div class="kv"><span>Social Security & Medicare</span><span class="num">−${money(c.fica,2)}</span></div><div class="kv"><span>State tax</span><span class="num">−${money(c.state,2)}</span></div><div class="kv"><span>401(k) & health</span><span class="num">−${money(c.pre,2)}</span></div><div class="kv"><span>Reimbursements</span><span class="num">+${money(c.reimb,2)}</span></div><div class="kv total"><span>Take-home</span><span class="num">${money(c.net,2)}</span></div>
   <div class="small muted">Also in their link: past pay stubs, paycheck comparison, W-2 and tax forms, and payment method changes (passkey + 48-hour hold).</div></div></div>`;

/* ---------- Render + events ---------- */
function render(){ renderNav(); $('#view').innerHTML=V[S.view](); }
function go(v){ S.view=v; if(v==='run'&&S.step>3)S.step=1; try{history.replaceState(null,'','#'+v)}catch(_){} render(); window.scrollTo(0,0); $('#bellpop').innerHTML=''; }

function drawer(html){ $('#layer').innerHTML=`<div class="drawer-scrim"><div class="drawer" role="dialog" aria-modal="true">${html}</div></div>`;
 const sc=$('.drawer-scrim'); sc.addEventListener('click',e=>{if(e.target===sc||e.target.closest('[data-x]'))$('#layer').innerHTML=''}); }

function confirmSubmit(){ const t=totals(); const needs=t.debit>15000;
 drawer(`<h2>${needs?'Submit for approval':'Submit payroll'}</h2><p class="muted" style="margin:0">${money(t.debit)} will be debited from your Payday account${needs?' after approval':''}. ${S.speed} pay.</p>
  <button class="btn btn-primary" id="pk">Confirm with passkey</button><button class="btn btn-ghost" data-x>Cancel</button>`);
 $('#pk').onclick=()=>{ const R=run('R-1128'); R.status=needs?'Awaiting approval':'Submitted'; $('#layer').innerHTML=''; toast(needs?'Sent to approvers':'Payroll submitted'); go(needs?'approvals':'pay'); };
}

const ACT={
 run:()=>{S.step=1;go('run')}, approvals:()=>go('approvals'), taxes:()=>go('taxes'), pay:()=>go('pay'),
 fund:()=>drawer(`<h2>Add money</h2><label class="small" for="amt">Amount<input class="field" id="amt" value="10000" inputmode="decimal" style="width:100%"></label>
   ${[['Bank transfer (ACH)','Chase ••4410 · 1 business day','Free'],['Wire','Same day','Bank fees'],['Stablecoin (USDC)','Any network · arrives in minutes','Free']].map((w,i)=>`<button class="way" data-src="${i}" aria-pressed="${i===0}"><span class="m"><b>${w[0]}</b><small>${w[1]}</small></span>${pill(w[2],w[2]==='Free'?'good':'plain')}</button>`).join('')}
   <button class="btn btn-primary" id="addm">Add money</button><button class="btn btn-ghost" data-x>Cancel</button>`),
 remind:()=>toast('Invite resent by text'),
 submit:confirmSubmit,
 approve:()=>{run('R-1128').status='Submitted';S.approvals.log.unshift({k:'good',t:'You approved Regular payroll · Nov 28. It will be debited on schedule.'});toast('Approved');render()},
 request:()=>{run('R-1128').status='Changes requested';S.approvals.log.unshift({k:'warn',t:'You requested changes: "Check Jo Alvarez overtime." Sent back to Ravi Shah.'});toast('Changes requested');render()},
 cancel:()=>{run('R-1128').status='Unprocessed';toast('Payroll cancelled. Nothing was debited.');render()},
 contractors:()=>{ const c=ctrs(); drawer(`<h2>Pay contractors · November</h2><p class="muted" style="margin:0">Approve invoices, then pay. International contractors see an estimated arrival date.</p>
   ${c.map(x=>`<div class="todo"><div class="t"><b>${esc(x.name)}</b><small>${esc(x.title)} · ${x.country} · ${x.way==='crypto'?'USDC, arrives in minutes':'bank, 1–2 days'}</small></div><span class="num">${money(x.amount)}</span></div>`).join('')}
   <div class="kv total"><span>Total</span><span class="num">${money(c.filter(x=>x.status!=='Awaiting invoice').reduce((a,x)=>a+x.amount,0))}</span></div>
   <div class="alert info">Nkem Eze's invoice isn't in yet. Approve all pays the others now.</div>
   <button class="btn btn-primary" id="payc">Approve all & pay</button><button class="btn btn-ghost" data-x>Close</button>`);
   $('#payc').onclick=()=>{run('C-1130').status='Submitted';$('#layer').innerHTML='';toast('Contractor payments sent');render()}; },
 addperson:()=>drawer(`<h2>Add person</h2><label class="small" for="nm">Name<input class="field" id="nm" style="width:100%" placeholder="Jordan Lee"></label>
   <label class="small" for="ty">Type<select class="field" id="ty" style="width:100%"><option>Employee (W-2)</option><option>Contractor (US)</option><option>Contractor (international)</option></select></label>
   <label class="small" for="ct">Phone, email or Telegram<input class="field" id="ct" style="width:100%"></label>
   <div class="alert info">We send them a link to fill in tax forms and choose how to get paid. You never handle their bank details.</div>
   <button class="btn btn-primary" id="addp">Send invite</button><button class="btn btn-ghost" data-x>Cancel</button>`),
 import:()=>toast('Upload a CSV: name, contact, pay, entity'), custom:()=>toast('Custom report builder: pick fields, filters, grouping'),
 runreport:()=>toast('Report ready: PDF, CSV or Excel'), notice:()=>toast('Upload a photo or PDF of the notice'), credit:()=>toast('Checking tip credit eligibility'),
 newrule:()=>toast('New rule: pick a condition (amount, entity, country) and approvers'), noop:()=>toast('Not in this prototype')
};

document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-act]'); if(a){ACT[a.dataset.act]&&ACT[a.dataset.act]();return}
 const st=e.target.closest('[data-step]'); if(st){S.step=+st.dataset.step;render();window.scrollTo(0,0);return}
 const sp=e.target.closest('[data-speed]'); if(sp){S.speed=sp.dataset.speed;render();return}
 const pt=e.target.closest('[data-ptab]'); if(pt){S.peopleTab=pt.dataset.ptab;render();return}
 const stb=e.target.closest('[data-stab]'); if(stb){S.settingsTab=stb.dataset.stab;render();return}
 const rc=e.target.closest('[data-rcat]'); if(rc){S.reportCat=rc.dataset.rcat;render();return}
 const ru=e.target.closest('[data-rule]'); if(ru){const r=S.approvals.rules[+ru.dataset.rule];r.on=!r.on;render();return}
 const w=e.target.closest('[data-way]'); if(w){const p=S.people.find(x=>x.id===(S.seeAs||1));p.way=w.dataset.way;p.split='100% '+WAYS.find(x=>x[0]===p.way)[1];render();toast('Saved. Applies from the next payday.');return}
 const src=e.target.closest('[data-src]'); if(src){$$('[data-src]').forEach(x=>x.setAttribute('aria-pressed',x===src));return}
 if(e.target.id==='addm'){const v=parseFloat($('#amt').value.replace(/[$,]/g,''));if(v>0){S.balance+=v;$('#layer').innerHTML='';toast(money(v)+' added');render()}return}
 if(e.target.id==='addp'){const n=$('#nm').value.trim();if(!n){toast('Add a name first');return}$('#layer').innerHTML='';toast('Invite sent to '+n);return}
 if(e.target.id==='bulk'){emps().forEach(p=>{if(p.pay==='hourly')p.hrs=80});render();toast('Set regular hours to 80 for hourly staff');return}
 const pr=e.target.closest('[data-person]'); if(pr){const p=S.people.find(x=>x.id===+pr.dataset.person);const c=calc(p);
  drawer(`<div class="who">${av(p)}<div><h2>${esc(p.name)}</h2><small>${esc(p.title)} · ${ENT[p.ent]}</small></div></div>
   <div class="card"><h3>Job & pay</h3><div class="kv"><span>Pay</span><span>${p.pay==='salary'?money(p.salary)+' per year':money(p.rate,2)+' per hour'}</span></div><div class="kv"><span>Schedule</span><span>Every other Friday</span></div><div class="kv"><span>This payroll (est.)</span><span class="num">${money(c.g,2)} gross · ${money(c.net,2)} take-home</span></div></div>
   <div class="card"><h3>Payment</h3><div class="kv"><span>Gets paid by</span><span>${esc(p.split)}</span></div><div class="small muted">Only ${esc(p.name.split(' ')[0])} can change this, with their passkey.</div></div>
   <div class="card"><h3>Taxes & documents</h3><div class="kv"><span>W-4</span><span>${p.last?'On file':'Waiting'}</span></div><div class="kv"><span>State withholding</span><span>${p.ent==='sf'?'DE 4 on file':'IT-2104 on file'}</span></div><div class="kv"><span>Pay stubs</span><span>${p.last?'6':'0'}</span></div></div>
   <button class="btn btn-ghost" data-x>Close</button>`);return}
 if(e.target.closest('#offcycle')){const m=$('#offmenu');m.innerHTML=m.innerHTML?'':`<div class="menu">${[['Bonus','Taxed at the supplemental rate, skips regular deductions'],['Correction','Fix a past paycheck, regular rate with deductions'],['Dismissal','Final paycheck following state rules'],['Past check date','Record a paycheck paid outside Payday'],['Prize or one-off payout','For contractors, creators or winners']].map(([a,b])=>`<button data-act="noop"><b>${a}</b><small>${b}</small></button>`).join('')}</div>`;return}
 if(e.target.closest('#bell')){const b=$('#bellpop');if(b.innerHTML){b.innerHTML='';return}
  b.innerHTML=`<div class="pop"><div class="tabs"><button class="tab" aria-selected="true">Tasks</button><button class="tab" aria-selected="false" data-act="noop">Activity</button></div>${tasks().slice(0,4).map(x=>`<div class="todo"><div class="t"><b class="small">${esc(x.title)}</b><small>${esc(x.sub)}</small></div><button class="btn btn-quiet" data-act="${x.act}">${x.btn}</button></div>`).join('')}</div>`;return}
 if(!e.target.closest('.pop')&&!e.target.closest('.menu')){$('#bellpop').innerHTML='';const m=$('#offmenu');if(m)m.innerHTML=''}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.p){const p=S.people.find(x=>x.id===+t.dataset.p);const v=parseFloat(t.value);if(!isNaN(v)&&v>=0){p[t.dataset.k]=v;const pos=t.selectionStart, id=t.dataset.p+t.dataset.k;render();const n=$(`[data-p="${t.dataset.p}"][data-k="${t.dataset.k}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}}
 if(t.id==='flt'){S.filter=t.value;render();const n=$('#flt');n.focus();n.setSelectionRange(n.value.length,n.value.length)}
});
document.addEventListener('change',e=>{
 if(e.target.id==='ent'){S.entity=e.target.value;render()}
 if(e.target.id==='mnav'){go(e.target.value)}
 if(e.target.id==='auto'){S.autopilot=e.target.checked;toast(S.autopilot?'AutoPilot on':'AutoPilot off')}
 if(e.target.id==='seeas'){S.seeAs=+e.target.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#layer').innerHTML='';$('#bellpop').innerHTML=''}});
const h=(location.hash||'').slice(1); if(V[h]) S.view=h;
render();
})();
</script>
