<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Guardian threshold size did not predict survival</title>
  <desc id="desc">Three bridge guardian configurations: Ronin 5-of-9 and Harmony 2-of-4 both failed through key compromise; HyperUnit 2-of-3 uses threshold signatures in secure enclaves and remains operating. The threshold number is not the security story; key custody is.</desc>
  <rect width="960" height="560" fill="#fbfaf5"/>
  <text x="54" y="48" fill="#b75e12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.2">EXHIBIT 3 / THRESHOLD DESIGN</text>
  <text x="54" y="84" fill="#17324a" font-family="Georgia, 'Times New Roman', serif" font-size="28">The threshold number didn't predict survival.</text>
  <text x="54" y="110" fill="#667b87" font-family="Arial, sans-serif" font-size="14">Guardian configurations vs outcomes — key custody, not quorum size, is the story</text>

  <g font-family="Arial, sans-serif">
    <rect x="54" y="150" width="270" height="280" rx="3" fill="#ffffff" stroke="#ccd6d8"/>
    <text x="76" y="180" fill="#b75e12" font-size="11" font-weight="700" letter-spacing=".8">RONIN · FAILED</text>
    <text x="76" y="224" fill="#17324a" font-size="40" font-weight="700">5-of-9</text>
    <text x="76" y="258" fill="#4f6f7f" font-size="13">Validator signing keys</text>
    <text x="76" y="280" fill="#4f6f7f" font-size="13">held as conventional keys;</text>
    <text x="76" y="302" fill="#4f6f7f" font-size="13">5 exfiltrated by Lazarus</text>
    <line x1="76" y1="330" x2="302" y2="330" stroke="#b9c8cc"/>
    <text x="76" y="360" fill="#b75e12" font-size="22" font-weight="700">~$624M stolen</text>
    <text x="76" y="388" fill="#667b87" font-size="12">Mar 2022 · largest bridge</text>
    <text x="76" y="406" fill="#667b87" font-size="12">exploit on record</text>

    <rect x="345" y="150" width="270" height="280" rx="3" fill="#ffffff" stroke="#ccd6d8"/>
    <text x="367" y="180" fill="#b75e12" font-size="11" font-weight="700" letter-spacing=".8">HARMONY HORIZON · FAILED</text>
    <text x="367" y="224" fill="#17324a" font-size="40" font-weight="700">2-of-4</text>
    <text x="367" y="258" fill="#4f6f7f" font-size="13">Multisig owners;</text>
    <text x="367" y="280" fill="#4f6f7f" font-size="13">attackers controlled</text>
    <text x="367" y="302" fill="#4f6f7f" font-size="13">2 of 4 signers</text>
    <line x1="367" y1="330" x2="593" y2="330" stroke="#b9c8cc"/>
    <text x="367" y="360" fill="#b75e12" font-size="22" font-weight="700">~$100M stolen</text>
    <text x="367" y="388" fill="#667b87" font-size="12">Jun 2022 · attributed to</text>
    <text x="367" y="406" fill="#667b87" font-size="12">Lazarus / APT38 (FBI)</text>

    <rect x="636" y="150" width="270" height="280" rx="3" fill="#17324a"/>
    <text x="658" y="180" fill="#e58d2b" font-size="11" font-weight="700" letter-spacing=".8">HYPERUNIT · OPERATING</text>
    <text x="658" y="224" fill="#ffffff" font-size="40" font-weight="700">2-of-3</text>
    <text x="658" y="258" fill="#d9e2e6" font-size="13">Threshold signatures;</text>
    <text x="658" y="280" fill="#d9e2e6" font-size="13">shares in secure enclaves,</text>
    <text x="658" y="302" fill="#d9e2e6" font-size="13">combined only at runtime</text>
    <line x1="658" y1="330" x2="884" y2="330" stroke="#4f6f7f"/>
    <text x="658" y="360" fill="#ffffff" font-size="22" font-weight="700">No incident</text>
    <text x="658" y="388" fill="#d9e2e6" font-size="12">Plus collective circuit-</text>
    <text x="658" y="406" fill="#d9e2e6" font-size="12">breaker pause policies</text>
  </g>

  <line x1="54" y1="462" x2="906" y2="462" stroke="#b9c8cc"/>
  <text x="54" y="492" fill="#17324a" font-family="Arial, sans-serif" font-size="13" font-weight="700">A 5-of-9 failed and a 2-of-3 holds: quorum size never was the security variable.</text>
  <text x="54" y="516" fill="#667b87" font-family="Arial, sans-serif" font-size="12">Caveat: HyperUnit is unaudited (no public audit found); "operating" is absence of incident, not proof of security.</text>
</svg>
