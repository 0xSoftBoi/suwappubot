<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">Nine public codebases, zero canonical ERC-8056 code-search matches</title>
  <desc id="desc">A GitHub code-search audit of nine public wallet, portfolio, explorer, DEX-interface and EVM-library repositories found zero matches for eight canonical ERC-8056 markers. Suwappu's pre-study main snapshot also had zero matches. This is an integration signal, not proof that products lack runtime support.</desc>
  <rect width="960" height="600" fill="#fbfaf5"/>
  <text x="54" y="48" fill="#b75e12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.2">PUBLIC-CODE AUDIT / 07 AUG 2026</text>
  <text x="54" y="102" fill="#17324a" font-family="Georgia, 'Times New Roman', serif" font-size="43">9 codebases.</text>
  <text x="54" y="149" fill="#17324a" font-family="Georgia, 'Times New Roman', serif" font-size="43">0 canonical ERC-8056 matches.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <rect x="54" y="188" width="852" height="222" rx="4" fill="#ffffff" stroke="#ccd6d8"/>
    <g fill="#17324a">
      <text x="80" y="226">MetaMask / extension</text>
      <text x="80" y="270">Rabby</text>
      <text x="80" y="314">Rainbow</text>
      <text x="80" y="358">Trust Wallet / core</text>
      <text x="365" y="226">rotki</text>
      <text x="365" y="270">Blockscout / frontend</text>
      <text x="365" y="314">viem</text>
      <text x="365" y="358">ethers.js</text>
      <text x="650" y="226">Uniswap / interface</text>
    </g>
    <g fill="#b75e12" font-weight="700">
      <text x="300" y="226">0</text>
      <text x="300" y="270">0</text>
      <text x="300" y="314">0</text>
      <text x="300" y="358">0</text>
      <text x="585" y="226">0</text>
      <text x="585" y="270">0</text>
      <text x="585" y="314">0</text>
      <text x="585" y="358">0</text>
      <text x="870" y="226" text-anchor="end">0</text>
    </g>
  </g>

  <rect x="54" y="434" width="852" height="58" rx="3" fill="#17324a"/>
  <text x="76" y="458" fill="#e58d2b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">WE RAN THE SAME CHECK ON OURSELVES</text>
  <text x="76" y="480" fill="#ffffff" font-family="Arial, sans-serif" font-size="15">Suwappu main: 0 canonical markers too — Stock Token trading is currently fail-closed.</text>

  <text x="54" y="526" fill="#667b87" font-family="Arial, sans-serif" font-size="13">Queries: uiMultiplier · balanceOfUI · UIMultiplierUpdated · ERC-8056 · 4 published interface IDs</text>
  <text x="54" y="546" fill="#667b87" font-family="Arial, sans-serif" font-size="13">Boundary: public indexed default-branch search only. Zero markers do not prove absence of runtime support.</text>
  <line x1="54" y1="562" x2="906" y2="562" stroke="#ccd6d8"/>
  <text x="54" y="584" fill="#b75e12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">SUWAPPU RESEARCH</text>
  <text x="906" y="584" text-anchor="end" fill="#4f6f7f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">CNT-20260807-001 / V3</text>
</svg>
