<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">A 10-for-1 stock split can leave the raw ERC-20 balance unchanged</title>
  <desc id="desc">Before a documented 10-for-1 split example, one raw token represents one share. After, the raw token balance remains one while the ERC-8056 UI multiplier becomes ten and the share-equivalent balance becomes ten.</desc>
  <rect width="960" height="600" fill="#fbfaf5"/>

  <text x="54" y="48" fill="#b75e12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.2">ERC-8056 / 10:1 SPLIT FIXTURE</text>
  <text x="54" y="91" fill="#17324a" font-family="Georgia, 'Times New Roman', serif" font-size="38">A stock split can leave</text>
  <text x="54" y="134" fill="#17324a" font-family="Georgia, 'Times New Roman', serif" font-size="38"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">balanceOf()</tspan><tspan> unchanged.</tspan></text>

  <g font-family="Arial, sans-serif">
    <rect x="54" y="174" width="360" height="292" rx="4" fill="#ffffff" stroke="#ccd6d8"/>
    <text x="78" y="205" fill="#667b87" font-size="11" font-weight="700" letter-spacing="1">BEFORE SPLIT</text>
    <text x="78" y="243" fill="#17324a" font-size="15">raw ERC-20 balance</text>
    <text x="390" y="244" text-anchor="end" fill="#17324a" font-size="28" font-weight="700">1.000</text>
    <line x1="78" y1="262" x2="390" y2="262" stroke="#e7eceb"/>
    <text x="78" y="299" fill="#17324a" font-size="15">uiMultiplier</text>
    <text x="390" y="300" text-anchor="end" fill="#17324a" font-size="28" font-weight="700">1×</text>
    <line x1="78" y1="318" x2="390" y2="318" stroke="#e7eceb"/>
    <text x="78" y="355" fill="#17324a" font-size="15">share-equivalent</text>
    <text x="390" y="356" text-anchor="end" fill="#17324a" font-size="28" font-weight="700">1.000</text>
    <line x1="78" y1="374" x2="390" y2="374" stroke="#e7eceb"/>
    <text x="78" y="411" fill="#667b87" font-size="13">underlying share</text>
    <text x="390" y="412" text-anchor="end" fill="#667b87" font-size="18" font-weight="700">$200</text>
    <text x="78" y="441" fill="#667b87" font-size="13">Chainlink token feed</text>
    <text x="390" y="442" text-anchor="end" fill="#667b87" font-size="18" font-weight="700">$200</text>

    <path d="M438 310 H518" stroke="#b75e12" stroke-width="3"/>
    <path d="M507 301 L520 310 L507 319" fill="none" stroke="#b75e12" stroke-width="3"/>
    <text x="479" y="289" text-anchor="middle" fill="#b75e12" font-size="11" font-weight="700" letter-spacing=".8">10:1</text>

    <rect x="546" y="174" width="360" height="292" rx="4" fill="#eef3f2" stroke="#9fb1b7"/>
    <text x="570" y="205" fill="#b75e12" font-size="11" font-weight="700" letter-spacing="1">AFTER SPLIT</text>
    <text x="570" y="243" fill="#17324a" font-size="15">raw ERC-20 balance</text>
    <text x="882" y="244" text-anchor="end" fill="#17324a" font-size="28" font-weight="700">1.000</text>
    <text x="882" y="260" text-anchor="end" fill="#b75e12" font-size="10" font-weight="700">UNCHANGED</text>
    <line x1="570" y1="276" x2="882" y2="276" stroke="#ccd6d8"/>
    <text x="570" y="313" fill="#17324a" font-size="15">uiMultiplier</text>
    <text x="882" y="314" text-anchor="end" fill="#b75e12" font-size="28" font-weight="700">10×</text>
    <line x1="570" y1="332" x2="882" y2="332" stroke="#ccd6d8"/>
    <text x="570" y="369" fill="#17324a" font-size="15">share-equivalent</text>
    <text x="882" y="370" text-anchor="end" fill="#b75e12" font-size="28" font-weight="700">10.000</text>
    <line x1="570" y1="388" x2="882" y2="388" stroke="#ccd6d8"/>
    <text x="570" y="419" fill="#667b87" font-size="13">underlying share</text>
    <text x="882" y="420" text-anchor="end" fill="#667b87" font-size="18" font-weight="700">$20</text>
    <text x="570" y="449" fill="#667b87" font-size="13">Chainlink token feed</text>
    <text x="882" y="450" text-anchor="end" fill="#667b87" font-size="18" font-weight="700">$200</text>
  </g>

  <text x="54" y="510" fill="#17324a" font-family="Georgia, 'Times New Roman', serif" font-size="23">The contract did not break. The abstraction got a new layer.</text>
  <text x="54" y="545" fill="#667b87" font-family="Arial, sans-serif" font-size="13">Official Chainlink 10:1 documentation example · raw balance stays static per Robinhood · ERC-8056 is Draft</text>
  <line x1="54" y1="562" x2="906" y2="562" stroke="#ccd6d8"/>
  <text x="54" y="584" fill="#b75e12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">SUWAPPU RESEARCH</text>
  <text x="906" y="584" text-anchor="end" fill="#4f6f7f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">suwappu.bot/research/erc8056-stock-split-interface-risk</text>
</svg>
