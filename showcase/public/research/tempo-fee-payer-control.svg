<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Tempo fee payer as a separate treasury authority</title>
  <desc id="desc">Sender asset authorization and sponsor fee authorization converge on one Tempo type 0x76 approve-plus-swap transaction, separating payment authority from network-fee liability without making a settlement-finality claim.</desc>
  <rect width="960" height="520" fill="#fbfaf5"/>
  <text x="54" y="48" fill="#b75e12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.2">TREASURY AUTHORITY / TEMPO FEE PAYER</text>
  <text x="54" y="84" fill="#17324a" font-family="Georgia, 'Times New Roman', serif" font-size="28">Asset authority and fee liability are separable.</text>
  <text x="54" y="110" fill="#667b87" font-family="Arial, sans-serif" font-size="14">Source-verified implementation · production enablement unverified</text>

  <g font-family="Arial, sans-serif">
    <rect x="54" y="151" width="190" height="132" rx="3" fill="#ffffff" stroke="#ccd6d8"/>
    <text x="72" y="178" fill="#b75e12" font-size="11" font-weight="700" letter-spacing=".8">01 / SENDER</text>
    <text x="72" y="208" fill="#17324a" font-size="18" font-weight="700">Authorize calls</text>
    <text x="72" y="234" fill="#4f6f7f" font-size="13">Sender hash signed by</text>
    <text x="72" y="253" fill="#4f6f7f" font-size="13">root or scoped access key</text>

    <path d="M244 217 H280" stroke="#b75e12" stroke-width="2"/>
    <path d="M274 211 L282 217 L274 223" fill="none" stroke="#b75e12" stroke-width="2"/>

    <rect x="282" y="151" width="218" height="132" rx="3" fill="#17324a"/>
    <text x="302" y="178" fill="#e58d2b" font-size="11" font-weight="700" letter-spacing=".8">02 / TYPE 0x76</text>
    <text x="302" y="208" fill="#ffffff" font-size="18" font-weight="700">Atomic call set</text>
    <text x="302" y="234" fill="#d9e2e6" font-size="13">approve(DEX, amount)</text>
    <text x="302" y="253" fill="#d9e2e6" font-size="13">+ swapExactAmountIn(...)</text>

    <path d="M500 217 H536" stroke="#b75e12" stroke-width="2"/>
    <path d="M530 211 L538 217 L530 223" fill="none" stroke="#b75e12" stroke-width="2"/>

    <rect x="538" y="151" width="190" height="132" rx="3" fill="#ffffff" stroke="#ccd6d8"/>
    <text x="556" y="178" fill="#b75e12" font-size="11" font-weight="700" letter-spacing=".8">03 / SPONSOR</text>
    <text x="556" y="208" fill="#17324a" font-size="18" font-weight="700">Authorize fee</text>
    <text x="556" y="234" fill="#4f6f7f" font-size="13">Fee-payer signature commits</text>
    <text x="556" y="253" fill="#4f6f7f" font-size="13">to sender + fee token</text>

    <path d="M728 217 H764" stroke="#b75e12" stroke-width="2"/>
    <path d="M758 211 L766 217 L758 223" fill="none" stroke="#b75e12" stroke-width="2"/>

    <rect x="766" y="151" width="140" height="132" rx="3" fill="#eef3f2" stroke="#ccd6d8"/>
    <text x="784" y="178" fill="#b75e12" font-size="11" font-weight="700" letter-spacing=".8">04 / NETWORK</text>
    <text x="784" y="208" fill="#17324a" font-size="18" font-weight="700">Execute</text>
    <text x="784" y="234" fill="#4f6f7f" font-size="13">Sponsor accepts</text>
    <text x="784" y="253" fill="#4f6f7f" font-size="13">network-fee debit</text>
  </g>

  <line x1="54" y1="324" x2="906" y2="324" stroke="#b9c8cc"/>
  <text x="54" y="353" fill="#17324a" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".6">CONTROL BOUNDARY IN CURRENT SOURCE</text>
  <g font-family="Arial, sans-serif">
    <text x="54" y="388" fill="#667b87" font-size="11" font-weight="700">PRODUCTION FLAG</text>
    <text x="54" y="410" fill="#17324a" font-size="17" font-weight="700">Default: OFF</text>
    <text x="254" y="388" fill="#667b87" font-size="11" font-weight="700">USER POLICY</text>
    <text x="254" y="410" fill="#17324a" font-size="17" font-weight="700">3 lifetime / DB persisted</text>
    <text x="514" y="388" fill="#667b87" font-size="11" font-weight="700">DAILY POLICY</text>
    <text x="514" y="410" fill="#17324a" font-size="17" font-weight="700">$100 / estimated spend</text>
  </g>
  <rect x="54" y="446" width="852" height="42" rx="2" fill="#17324a"/>
  <text x="72" y="472" fill="#ffffff" font-family="Arial, sans-serif" font-size="13"><tspan fill="#e58d2b" font-weight="700">KNOWN GAP</tspan><tspan dx="8">Eligibility check → on-chain execution → record are separate; no atomic reservation or actual-fee settlement.</tspan></text>
</svg>
