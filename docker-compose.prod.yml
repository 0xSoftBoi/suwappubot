version: '3.8'

services:
  bot:
    build: .
    restart: always
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://suwappubot:${DB_PASSWORD}@db:5432/suwappubot
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - suwappu-net

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: always
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=postgresql://suwappubot:${DB_PASSWORD}@db:5432/suwappubot
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - suwappu-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - suwappu-net

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=suwappubot
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=suwappubot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - suwappu-net

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - suwappu-net

networks:
  suwappu-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
