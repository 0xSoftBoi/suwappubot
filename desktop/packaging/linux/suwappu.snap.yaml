name: suwappu
version: '0.1.0'
summary: Cross-chain DEX trading terminal
description: |
  Suwappu is a desktop trading terminal for cross-chain token swaps
  across multiple blockchains. It supports swapping tokens across 7+
  chains with a clean native UI.

  Features:
  - Multi-chain token swaps
  - Real-time price monitoring
  - Portfolio tracking
  - Trade alerts and limit orders

base: core22
grade: stable
confinement: strict
compression: lzo
icon: snap/gui/suwappu.png

architectures:
  - build-on: amd64

apps:
  suwappu:
    command: opt/suwappu/suwappu.AppImage --no-sandbox
    desktop: usr/share/applications/suwappu.desktop
    extensions:
      - gnome
    plugs:
      - browser-support
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - audio-playback
      - removable-media
      - password-manager-service
    environment:
      DISABLE_WAYLAND: '1'
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  suwappu:
    plugin: dump
    source: https://github.com/0xSoftBoi/suwappubot/releases/latest/download/Suwappu-$SNAPCRAFT_PROJECT_VERSION-x86_64.AppImage
    source-type: file
    organize:
      Suwappu-$SNAPCRAFT_PROJECT_VERSION-x86_64.AppImage: opt/suwappu/suwappu.AppImage
    stage-packages:
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libxss1
      - libxtst6
      - libsecret-1-0
      - libatspi2.0-0

  desktop-entry:
    plugin: dump
    source: snap/local/
    organize:
      suwappu.desktop: usr/share/applications/suwappu.desktop
