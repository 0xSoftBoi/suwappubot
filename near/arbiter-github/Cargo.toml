[package]
name = "arbiter-github"
version = "0.1.0"
edition = "2021"
description = "Suwappu Arbiter production rubric: GitHub PR delivered-as-specified. Fetches the PR from the GitHub API inside the enclave; no shared secret, no worker-supplied evidence."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasi-http-client = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
