[package]
name = "arbiter-contract"
version = "0.1.0"
edition = "2021"
description = "Suwappu Arbiter escrow: trustless milestone settlement verified inside an OutLayer TEE."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5", features = ["legacy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
