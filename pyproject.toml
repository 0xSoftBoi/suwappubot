[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "cmake>=3.14",
    "pybind11>=2.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "suwappubot"
version = "1.0.0"
description = "Cross-chain swap Telegram bot with C++ high-performance core"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Suwappu Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: C++",
]
dependencies = [
    "aiocache==0.12.2",
    "aiohttp==3.13.3",
    "alembic==1.16.5",
    "base58==2.1.1",
    "cmake>=3.14",
    "cryptography==46.0.5",
    "eth-account==0.11.0",
    "eth-utils==5.3.1",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "orjson>=3.10.14",
    "Pillow>=10.3.0",
    "pybind11>=2.10.0",
    "pydantic-settings>=2.2.1",
    "pydantic>=2.7.0",
    "pyotp==2.9.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "pytest==8.4.2",
    "python-dotenv==1.2.1",
    "python-telegram-bot==21.3",
    "pyyaml==6.0.3",
    "qrcode[pil]==7.4.2",
    "solana==0.36.11",
    "solders==0.27.1",
    "sqlalchemy>=2.0.29",
    "uvicorn[standard]>=0.32.1",
    "fastapi>=0.104.0",
    "PyJWT>=2.8.0",
    "web3>=7.0.0",
    "eth-typing>=4.0.0",
    "ecdsa>=0.19.0",
    "rlp>=3.0.0",
    "werkzeug>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
suwappubot = "bot.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

