[profile.default]
src = "."
out = "out"
libs = ["lib"]
test = "test"
script = "deploy"
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = false
skip = [
  "SuwpOFT.sol",
  "deploy/DeploySuwpOFT.s.sol",
  "test/**",
  "lib/openzeppelin-contracts/fv/**",
  "lib/openzeppelin-contracts/test/**",
  "lib/openzeppelin-contracts/contracts/crosschain/**",
  "lib/openzeppelin-contracts/contracts/mocks/**"
]

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
base_mainnet = { key = "${BASESCAN_API_KEY}", chain = 8453,  url = "https://api.basescan.org/api" }

[fmt]
line_length = 100
tab_width = 4
