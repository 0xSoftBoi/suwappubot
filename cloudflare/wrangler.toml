# Deploy the edge router + bind its hostnames in one command:
#   cd cloudflare && bunx wrangler deploy
#
# Prereqs (operator-only, can't be automated from here):
#   1. suwappu.bot added to this Cloudflare account as a site
#   2. Gandi nameservers delegated to Cloudflare (zone shows "Active")
#   3. bunx wrangler login   (interactive, like `railway login`)
#
# With custom_domain = true, `wrangler deploy` creates each Custom Domain and its
# edge TLS cert automatically — no manual DNS records. Only hosts with a live
# backend are listed; terminal/app/devapi are intentionally omitted (see README.md).

name = "suwappu-router"
main = "suwappu-router.worker.js"
compatibility_date = "2026-06-01"

routes = [
  { pattern = "api.suwappu.bot",      custom_domain = true },
  { pattern = "www.suwappu.bot",      custom_domain = true },
  { pattern = "suwappu.bot",          custom_domain = true },
  { pattern = "terminal.suwappu.bot", custom_domain = true },
  { pattern = "app.suwappu.bot",      custom_domain = true },
]

# --- Cloudflare Monetization Gateway (see docs/deployment/cloudflare-monetization-gateway.md) ---
# GATEWAY_PAID_PREFIXES is a plain var: comma-separated path prefixes the Gateway
# is configured to charge for. Uncomment + set once the Gateway waitlist access
# lands and pricing rules are created from GET /v1/agent/pricing.
# [vars]
# GATEWAY_PAID_PREFIXES = "/v1/agent/,/mcp"
#
# GATEWAY_HMAC_SECRET is a *secret*, not a var — it must never be committed here.
# Set it out-of-band with:
#   cd cloudflare && bunx wrangler secret put GATEWAY_HMAC_SECRET
# and mirror the same value into Railway's api-ts CF_GATEWAY_TRUST_SECRET.
