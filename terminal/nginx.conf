# Railway's edge proxy terminates every client connection, so $remote_addr in
# this container is the edge's address — shared by ALL visitors. Keying the
# limiter on it put the entire userbase in a single 10r/s bucket: during
# launch-traffic spikes nginx rejected everyone at once and the terminal
# appeared down while every Railway service showed healthy. Recover the real
# client IP from X-Forwarded-For instead. Measured from production access logs
# (deploy ba6b8a34): Railway hands us XFF as "<client>, <railway-hop>" with its
# own hop LAST — e.g. "172.174.110.130, 152.233.30.101" from remote_addr
# 152.233.30.101 — so recursive OFF (take the last entry) would key everyone on
# Railway's small edge-IP pool and re-create the shared bucket. recursive ON
# walks past the trusted hops to the leftmost entry, the real client. Tradeoff:
# a client forging an XFF prefix picks its own bucket key and can dodge its own
# limit, but it cannot collapse other users into one bucket, which is the
# failure mode this limiter exists to prevent; abuse protection for the API
# itself lives in api-ts.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=terminal:10m rate=30r/s;
limit_req_status 429;

server {
    # Railway routes to $PORT (dynamic), not 80 — rendered from this template at
    # startup by the nginx image's envsubst entrypoint. Listening on a fixed 80
    # is what caused the 502 (Railway's proxy hit a port nothing listened on).
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rate limiting is applied per-location below (API proxy + SPA shell), NOT
    # server-wide: a server-level limit also counted every fingerprinted asset
    # of a cold page load against the same bucket, so one first visit could
    # burn the burst allowance before the app made a single API call.

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Liveness: this answers only whether the Terminal nginx container itself is
    # alive. Railway deliberately keeps using this endpoint so an api-ts deploy
    # or transient database issue cannot restart Terminal and create a cascade.
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"suwappu-terminal"}';
    }

    # Readiness: dependency-aware and intentionally *not* used as Railway's
    # restart health check. External monitoring can hit /ready to prove the
    # same private-DNS hop used by real browser API traffic reaches api-ts and
    # that api-ts considers its database dependency healthy.
    location = /ready {
        access_log off;
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        resolver_timeout 3s;
        set $api_ts_upstream http://${API_TS_PRIVATE_DOMAIN}:${API_TS_PORT};
        proxy_pass $api_ts_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Production API traffic stays same-origin in the browser. nginx forwards
    # backend namespaces to api-ts over Railway private networking while keeping
    # browser-owned deep links in the SPA:
    #   /auth/callback/*
    #   /terminal/bridge
    #   /terminal/alert-swap
    # API_TS_PRIVATE_DOMAIN is a Railway reference variable resolving to the
    # api-ts private DNS name. This avoids baking a public API hostname into the
    # Vite bundle and keeps service-to-service traffic on Railway's network.
    location ~ ^/(auth/(?!callback(?:/|$))|terminal/(?!bridge(?:/|$)|alert-swap(?:/|$))|webapp(?:/|$)|public(?:/|$)|v1(?:/|$)) {
        # A literal hostname in proxy_pass is resolved ONCE, at nginx startup,
        # so every api-ts redeploy (new private IP) left this proxy dialing a
        # dead container: 502 "connection refused" / 504 "upstream timed out"
        # on /auth/* until the terminal itself was redeployed — which broke
        # Google sign-in in production. Putting the upstream in a variable
        # forces per-request resolution, re-resolved at most every `valid=`
        # seconds. NGINX_LOCAL_RESOLVERS is exported by the nginx image's own
        # 15-local-resolvers.envsh (the container's /etc/resolv.conf
        # nameservers — Railway's internal DNS here — with IPv6 addresses
        # already bracketed, which a hand-written "fd12::10" was not: nginx
        # read "::10" as a port and refused to boot).
        limit_req zone=terminal burst=60 nodelay;

        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
        resolver_timeout 3s;
        set $api_ts_upstream http://${API_TS_PRIVATE_DOMAIN}:${API_TS_PORT};
        proxy_pass $api_ts_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Fingerprinted static assets are safe to cache forever. A new deploy gets
    # a new filename, so old assets can remain cached without serving stale code.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The web manifest needs its own type. nginx has no mapping for
    # .webmanifest, so it falls back to application/octet-stream — which some
    # browsers refuse, dropping the install icon the manifest exists to provide.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all routes.
    #
    # DO NOT cache SPA HTML. index.html contains the current Vite fingerprinted
    # asset names. Caching it across deploys makes browsers request hashes that
    # no longer exist (observed in production as 404s for old CSS bundles on
    # Android), which can render the Terminal effectively broken even though
    # Railway and the API are healthy. Assets themselves stay immutable above;
    # only the HTML shell must always revalidate.
    location / {
        limit_req zone=terminal burst=60 nodelay;

        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

        # Security headers — allow embedding from showcase site.
        #
        # WALLET CONNECTIVITY: the wallet hosts below are load-bearing, not
        # optional hardening slack. Without them "Connect wallet" fails with a
        # console CSP error and the terminal looks dead — the market data still
        # renders, but no wallet can attach, so the portfolio is permanently
        # empty. Host list from Reown/WalletConnect's own CSP guidance
        # (docs.reown.com/advanced/security/content-security-policy); both the
        # .com and .org apexes are listed because AppKit still fails over
        # between them. Trimmed to what this app uses: no notify/echo/push
        # (no web push here). If you tighten this, load the terminal and click
        # Connect first — a silent CSP refusal is invisible server-side.
        #
        #   script-src  cdn.jsdelivr.net  -> Ledger Connect Kit loads from CDN
        #   script-src  us-assets.i.posthog.com -> PostHog snippet loads array.js from the assets host
        #   connect-src relay/rpc/api/... -> WalletConnect pairing + AppKit config
        #   connect-src walletlink/coinbase -> Coinbase Wallet SDK transport
        #   connect-src prices.curve.finance -> Curve pools panel (lib/curve.ts, browser-direct)
        #   connect-src api.dexscreener.com  -> Pulse/discovery market data (lib/dexscreener.ts)
        #   connect-src api.hyperliquid.xyz  -> HL public WS feed for signals/whales (lib/hyperliquidFeed.ts)
        #   connect-src us.i.posthog.com     -> PostHog event ingestion
        #   frame-src   verify/secure      -> WalletConnect Verify anti-phishing iframe
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://cdn.jsdelivr.net https://us-assets.i.posthog.com; connect-src 'self' https://devapi.suwappu.bot wss://ws-feed.exchange.coinbase.com https://prices.curve.finance https://api.dexscreener.com wss://api.hyperliquid.xyz https://api.hyperliquid.xyz https://us.i.posthog.com https://us-assets.i.posthog.com https://rpc.walletconnect.com https://rpc.walletconnect.org https://relay.walletconnect.com https://relay.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://pulse.walletconnect.com https://pulse.walletconnect.org https://api.web3modal.com https://api.web3modal.org https://keys.walletconnect.com https://keys.walletconnect.org wss://www.walletlink.org https://cca-lite.coinbase.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org; frame-ancestors 'self' https://www.suwappu.bot https://suwappu.bot" always;
        # Popup-based sign-in (Google) needs COOP to permit the popup handshake.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
