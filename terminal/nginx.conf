limit_req_zone $binary_remote_addr zone=terminal:10m rate=10r/s;

server {
    # Railway routes to $PORT (dynamic), not 80 — rendered from this template at
    # startup by the nginx image's envsubst entrypoint. Listening on a fixed 80
    # is what caused the 502 (Railway's proxy hit a port nothing listened on).
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rate limiting
    limit_req zone=terminal burst=20 nodelay;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Health check endpoint
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"suwappu-terminal"}';
    }

    # Production API traffic stays same-origin in the browser. nginx forwards
    # backend namespaces to api-ts over Railway private networking while keeping
    # browser-owned deep links in the SPA:
    #   /auth/callback/*
    #   /terminal/bridge
    #   /terminal/alert-swap
    # API_TS_PRIVATE_DOMAIN is a Railway reference variable resolving to the
    # api-ts private DNS name. This avoids baking a public API hostname into the
    # Vite bundle and keeps service-to-service traffic on Railway's network.
    location ~ ^/(auth/(?!callback(?:/|$))|terminal/(?!bridge(?:/|$)|alert-swap(?:/|$))|webapp(?:/|$)|public(?:/|$)|v1(?:/|$)) {
        # A literal hostname in proxy_pass is resolved ONCE, at nginx startup,
        # so every api-ts redeploy (new private IP) left this proxy dialing a
        # dead container: 502 "connection refused" / 504 "upstream timed out"
        # on /auth/* until the terminal itself was redeployed — which broke
        # Google sign-in in production. Putting the upstream in a variable
        # forces per-request resolution against Railway's internal DNS
        # (fd12::10, the documented private-networking resolver), re-resolved
        # at most every `valid=` seconds.
        resolver fd12::10 valid=10s;
        set $api_ts_upstream http://${API_TS_PRIVATE_DOMAIN}:${API_TS_PORT};
        proxy_pass $api_ts_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets with aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The web manifest needs its own type. nginx has no mapping for
    # .webmanifest, so it falls back to application/octet-stream — which some
    # browsers refuse, dropping the install icon the manifest exists to provide.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers — allow embedding from showcase site.
        #
        # WALLET CONNECTIVITY: the wallet hosts below are load-bearing, not
        # optional hardening slack. Without them "Connect wallet" fails with a
        # console CSP error and the terminal looks dead — the market data still
        # renders, but no wallet can attach, so the portfolio is permanently
        # empty. Host list from Reown/WalletConnect's own CSP guidance
        # (docs.reown.com/advanced/security/content-security-policy); both the
        # .com and .org apexes are listed because AppKit still fails over
        # between them. Trimmed to what this app uses: no notify/echo/push
        # (no web push here). If you tighten this, load the terminal and click
        # Connect first — a silent CSP refusal is invisible server-side.
        #
        #   script-src  cdn.jsdelivr.net  -> Ledger Connect Kit loads from CDN
        #   connect-src relay/rpc/api/... -> WalletConnect pairing + AppKit config
        #   connect-src walletlink/coinbase -> Coinbase Wallet SDK transport
        #   frame-src   verify/secure      -> WalletConnect Verify anti-phishing iframe
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://cdn.jsdelivr.net; connect-src 'self' https://devapi.suwappu.bot wss://ws-feed.exchange.coinbase.com https://rpc.walletconnect.com https://rpc.walletconnect.org https://relay.walletconnect.com https://relay.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://pulse.walletconnect.com https://pulse.walletconnect.org https://api.web3modal.com https://api.web3modal.org https://keys.walletconnect.com https://keys.walletconnect.org wss://www.walletlink.org https://cca-lite.coinbase.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org; frame-ancestors 'self' https://www.suwappu.bot https://suwappu.bot" always;
        # Popup-based sign-in (Google) needs COOP to permit the popup handshake.
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
