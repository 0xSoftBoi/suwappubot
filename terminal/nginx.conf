limit_req_zone $binary_remote_addr zone=terminal:10m rate=10r/s;

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=terminal burst=20 nodelay;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"suwappu-terminal"}';
    }

    # Same-origin gateway for the read-only Signal Intelligence service. The
    # browser never needs to know the Railway service hostname; this keeps the
    # product on suwappu.bot and avoids cross-origin data access/CORS drift.
    location ^~ /signal-api/ {
        proxy_http_version 1.1;
        proxy_set_header Host signal-lab.railway.internal;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_pass http://signal-lab.railway.internal:8080/api/;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org https://cdn.jsdelivr.net; connect-src 'self' https://api.suwappu.bot https://devapi.suwappu.bot wss://ws-feed.exchange.coinbase.com https://rpc.walletconnect.com https://rpc.walletconnect.org https://relay.walletconnect.com https://relay.walletconnect.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://pulse.walletconnect.com https://pulse.walletconnect.org https://api.web3modal.com https://api.web3modal.org https://keys.walletconnect.com https://keys.walletconnect.org wss://www.walletlink.org https://cca-lite.coinbase.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src 'self' https://verify.walletconnect.com https://verify.walletconnect.org https://secure.walletconnect.com https://secure.walletconnect.org; frame-ancestors 'self' https://www.suwappu.bot https://suwappu.bot" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~ /\. {
        deny all;
    }
}
